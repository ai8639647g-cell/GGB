<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Z-SURVIVAL 3D ULTRA MOBILE</title>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root{
    --primary:#ff0055;
    --secondary:#00ffcc;
    --ult:#9900ff;
    --bg:#020205;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020205;
    color:white;
    font-family:Arial,sans-serif;
}

#login-screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,#15051d,#010102 75%);
    z-index:1000;
}

.login-box{
    width:88%;
    max-width:420px;
    padding:32px;
    text-align:center;
    background:rgba(8,8,15,.96);
    border:2px solid var(--secondary);
    border-radius:24px;
    box-shadow:0 0 35px rgba(0,255,204,.3);
}

.login-box h1{
    color:white;
    font-size:28px;
    margin-bottom:25px;
    text-shadow:0 0 15px var(--primary);
}

.input-group{
    margin-bottom:20px;
    text-align:left;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:var(--secondary);
    font-size:12px;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid rgba(0,255,204,.3);
    background:#000;
    color:white;
    text-align:center;
    font-size:16px;
}

.btn-start{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:linear-gradient(45deg,#ff0055,#cc0044);
    color:white;
    font-size:17px;
    font-weight:bold;
}

#game-container{
    position:fixed;
    inset:0;
    display:none;
}

#canvas-holder{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
}

.hud-panel{
    position:absolute;
    z-index:20;
    padding:12px;
    background:rgba(0,0,0,.7);
    border-radius:10px;
    pointer-events:none;
    backdrop-filter:blur(5px);
}

.hud-top-left{
    top:12px;
    left:12px;
    border-left:4px solid var(--secondary);
}

.hud-top-right{
    top:12px;
    right:12px;
    text-align:right;
    border-right:4px solid var(--primary);
}

.hp-bar-container{
    width:160px;
    height:12px;
    margin-top:7px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
}

#hp-bar{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#ff0055,#ff7700);
}

#score-val{
    color:var(--secondary);
    font-size:24px;
    font-weight:bold;
}

#joystick-zone{
    position:absolute;
    z-index:50;
    left:35px;
    bottom:35px;
    width:130px;
    height:130px;
    border-radius:50%;
    border:2px solid rgba(0,255,204,.3);
    background:rgba(255,255,255,.04);
}

#joystick-knob{
    position:absolute;
    width:55px;
    height:55px;
    left:50%;
    top:50%;
    margin-left:-27.5px;
    margin-top:-27.5px;
    border-radius:50%;
    background:radial-gradient(circle,#00ffcc,#005544);
    box-shadow:0 0 18px #00ffcc;
}

.action-zone{
    position:absolute;
    right:30px;
    bottom:35px;
    width:175px;
    height:175px;
    z-index:50;
}

#attack-btn{
    position:absolute;
    right:0;
    bottom:0;
    width:95px;
    height:95px;
    border-radius:50%;
    border:3px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#ff0055,#88002e);
    box-shadow:0 0 25px rgba(255,0,85,.6);
    font-weight:bold;
}

#skill-btn{
    position:absolute;
    left:0;
    top:0;
    width:65px;
    height:65px;
    border-radius:50%;
    border:2px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#9900ff,#440088);
    box-shadow:0 0 20px rgba(153,0,255,.6);
    font-weight:bold;
}

.cooldown-overlay{
    position:absolute;
    inset:0;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
}

#weapon-dock{
    position:absolute;
    z-index:40;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
    padding:7px;
    background:rgba(0,0,0,.75);
    border-radius:20px;
}

.dock-btn{
    padding:8px 12px;
    border-radius:12px;
    background:#111;
    border:1px solid #444;
    color:#777;
    font-weight:bold;
}

.dock-btn.active{
    color:#00ffcc;
    border-color:#00ffcc;
}

#game-over-screen{
    position:fixed;
    inset:0;
    z-index:900;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(2,1,4,.96);
    text-align:center;
}

#game-over-screen h2{
    color:#ff0055;
    font-size:38px;
    text-shadow:0 0 25px #ff0055;
}

.btn-restart{
    margin-top:25px;
    padding:14px 35px;
    background:transparent;
    border:2px solid #00ffcc;
    color:#00ffcc;
    border-radius:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="login-screen">
    <div class="login-box">
        <h1>Z-SURVIVAL</h1>

        <div class="input-group">
            <label>CYBER SLAYER NAME</label>
            <input id="username-input"
                   value="Slayer_Ultra"
                   maxlength="12">
        </div>

        <button class="btn-start" id="start-btn">
            START ENGINE
        </button>
    </div>
</div>

<div id="game-container">

    <div id="canvas-holder"></div>

    <div class="hud-panel hud-top-left">
        <div id="hud-pname">PLAYER</div>
        <div class="hp-bar-container">
            <div id="hp-bar"></div>
        </div>
    </div>

    <div class="hud-panel hud-top-right">
        <div style="font-size:10px;color:#888">
            CYBER ENERGY
        </div>
        <div id="score-val">0000</div>
    </div>

    <div id="weapon-dock">
        <button class="dock-btn active" data-weapon="katana">
            KATANA
        </button>

        <button class="dock-btn" data-weapon="axe">
            CYBER AXE
        </button>

        <button class="dock-btn" data-weapon="spear">
            PLASMA
        </button>
    </div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div class="action-zone">

        <div id="skill-btn">
            ULT
            <div class="cooldown-overlay" id="skill-cd">
                5
            </div>
        </div>

        <div id="attack-btn">
            SLASH
        </div>

    </div>

</div>

<div id="game-over-screen">

    <h2>ELIMINATED</h2>

    <p id="final-score">
        SCORE: 0
    </p>

    <button class="btn-restart" id="restart-btn">
        REVIVE SYSTEM
    </button>

</div>

<script>

let scene;
let camera;
let renderer;
let clock;

let player;
let playerBody;
let leftLeg;
let rightLeg;
let weaponMesh;

let zombies=[];
let particles=[];
let drops=[];

let playerHp=100;
let score=0;

let gameRunning=false;
let gameOver=false;

let currentWeapon="katana";

let attackCooldown=0;
let isAttacking=false;
let weaponRotation=0;

let ultCooldown=0;

let moveX=0;
let moveZ=0;

let joystickActive=false;
let joystickStartX=0;
let joystickStartY=0;

let spawnTimer=0;

const weaponStats={

    katana:{
        range:2.8,
        damage:1,
        cooldown:18,
        color:0x00ffcc
    },

    axe:{
        range:2.3,
        damage:2,
        cooldown:28,
        color:0xff0055
    },

    spear:{
        range:3.7,
        damage:1.4,
        cooldown:22,
        color:0xffff00
    }

};

const $=id=>document.getElementById(id);


/* =========================
   START GAME
========================= */

$("start-btn").addEventListener("click",startGame);

function startGame(){

    const name=$("username-input").value.trim();

    $("hud-pname").textContent=
        (name || "SLAYER").toUpperCase();

    $("login-screen").style.display="none";
    $("game-container").style.display="block";

    init3D();
    setupControls();

    gameRunning=true;
    gameOver=false;

    animate();
}


/* =========================
   THREE.JS
========================= */

function init3D(){

    clock=new THREE.Clock();

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x020205);

    scene.fog=
        new THREE.FogExp2(0x020205,0.035);


    camera=new THREE.PerspectiveCamera(
        60,
        window.innerWidth/window.innerHeight,
        .1,
        500
    );


    renderer=new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    $("canvas-holder").appendChild(
        renderer.domElement
    );


    /* LIGHT */

    scene.add(
        new THREE.AmbientLight(
            0x202040,
            1.5
        )
    );

    const light=
        new THREE.DirectionalLight(
            0xff4488,
            1
        );

    light.position.set(20,30,15);

    scene.add(light);


    /* GROUND */

    const ground=
        new THREE.Mesh(
            new THREE.PlaneGeometry(300,300),
            new THREE.MeshStandardMaterial({
                color:0x05060a,
                roughness:.9
            })
        );

    ground.rotation.x=-Math.PI/2;

    scene.add(ground);


    const grid=
        new THREE.GridHelper(
            300,
            80,
            0xff0055,
            0x081018
        );

    grid.position.y=.01;

    scene.add(grid);


    createEnvironment();
    createPlayer();
    buildWeapon();


    window.addEventListener(
        "resize",
        resizeGame
    );
}


/* =========================
   ENVIRONMENT
========================= */

function createEnvironment(){

    for(let i=0;i<35;i++){

        const h=8+Math.random()*18;
        const w=4+Math.random()*5;

        const building=
            new THREE.Mesh(
                new THREE.BoxGeometry(w,h,w),
                new THREE.MeshStandardMaterial({
                    color:0x0b0d15,
                    metalness:.3,
                    roughness:.7
                })
            );

        const angle=Math.random()*Math.PI*2;
        const radius=30+Math.random()*100;

        building.position.set(
            Math.cos(angle)*radius,
            h/2,
            Math.sin(angle)*radius
        );

        scene.add(building);
    }

    for(let i=0;i<40;i++){

        const tree=
            new THREE.Group();

        const trunk=
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .12,.22,2.2,6
                ),
                new THREE.MeshStandardMaterial({
                    color:0x251408
                })
            );

        trunk.position.y=1.1;

        const leaves=
            new THREE.Mesh(
                new THREE.DodecahedronGeometry(
                    1.1,
                    0
                ),
                new THREE.MeshStandardMaterial({
                    color:0x063d20
                })
            );

        leaves.position.y=2.6;

        tree.add(trunk);
        tree.add(leaves);

        const angle=Math.random()*Math.PI*2;
        const radius=12+Math.random()*90;

        tree.position.set(
            Math.cos(angle)*radius,
            0,
            Math.sin(angle)*radius
        );

        scene.add(tree);
    }
}


/* =========================
   PLAYER
========================= */

function createPlayer(){

    player=new THREE.Group();

    playerBody=new THREE.Group();


    const chest=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .4,.32,1,6
            ),
            new THREE.MeshStandardMaterial({
                color:0x0055ff,
                metalness:.6
            })
        );

    chest.position.y=.5;


    const head=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .28,12,12
            ),
            new THREE.MeshStandardMaterial({
                color:0x080f20,
                metalness:.9
            })
        );

    head.position.y=1.15;


    const visor=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .36,.08,.22
            ),
            new THREE.MeshBasicMaterial({
                color:0x00ffcc
            })
        );

    visor.position.set(
        0,
        1.15,
        -.23
    );


    playerBody.add(chest);
    playerBody.add(head);
    playerBody.add(visor);

    playerBody.position.y=.6;

    player.add(playerBody);


    const legMaterial=
        new THREE.MeshStandardMaterial({
            color:0x001166
        });


    leftLeg=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .12,.08,.6,6
            ),
            legMaterial
        );

    rightLeg=
        leftLeg.clone();


    leftLeg.position.set(
        -.22,.3,0
    );

    rightLeg.position.set(
        .22,.3,0
    );


    player.add(leftLeg);
    player.add(rightLeg);

    scene.add(player);

    camera.position.set(
        player.position.x,
        11,
        player.position.z+8.5
    );

    camera.lookAt(
        player.position.x,
        0,
        player.position.z
    );
}


/* =========================
   WEAPON
========================= */

function buildWeapon(){

    if(weaponMesh){
        playerBody.remove(weaponMesh);
    }

    const stats=
        weaponStats[currentWeapon];

    weaponMesh=
        new THREE.Group();


    let blade;


    if(currentWeapon==="axe"){

        blade=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .18,1.2,.7
                ),
                new THREE.MeshStandardMaterial({
                    color:stats.color,
                    emissive:stats.color
                })
            );

    }else{

        blade=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .08,
                    currentWeapon==="spear"
                        ?2.2
                        :1.6,
                    .08
                ),
                new THREE.MeshStandardMaterial({
                    color:stats.color,
                    emissive:stats.color
                })
            );
    }


    blade.position.y=
        currentWeapon==="spear"
            ?1.1
            :.8;


    const handle=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .04,.04,.55,6
            ),
            new THREE.MeshStandardMaterial({
                color:0x222222
            })
        );


    weaponMesh.add(blade);
    weaponMesh.add(handle);

    weaponMesh.position.set(
        .55,.3,-.3
    );

    weaponMesh.rotation.x=
        Math.PI/2;

    playerBody.add(
        weaponMesh
    );
}


/* =========================
   WEAPON BUTTONS
========================= */

document.querySelectorAll(".dock-btn")
.forEach(btn=>{

    btn.addEventListener("click",()=>{

        currentWeapon=
            btn.dataset.weapon;

        document.querySelectorAll(
            ".dock-btn"
        ).forEach(b=>
            b.classList.remove("active")
        );

        btn.classList.add("active");

        buildWeapon();
    });

});


/* =========================
   CONTROLS
========================= */

function setupControls(){

    const zone=$("joystick-zone");
    const knob=$("joystick-knob");


    zone.addEventListener(
        "touchstart",
        e=>{

            const t=e.touches[0];
            const r=zone.getBoundingClientRect();

            joystickActive=true;

            joystickStartX=
                r.left+r.width/2;

            joystickStartY=
                r.top+r.height/2;

        },
        {passive:true}
    );


    window.addEventListener(
        "touchmove",
        e=>{

            if(!joystickActive)return;

            const t=e.touches[0];

            let dx=
                t.clientX-joystickStartX;

            let dy=
                t.clientY-joystickStartY;

            const max=45;

            const distance=
                Math.sqrt(dx*dx+dy*dy);

            if(distance>max){

                dx=
                    dx/distance*max;

                dy=
                    dy/distance*max;
            }

            knob.style.transform=
                `translate(${dx}px,${dy}px)`;

            moveX=dx/max;
            moveZ=dy/max;

        },
        {passive:true}
    );


    window.addEventListener(
        "touchend",
        ()=>{

            joystickActive=false;

            knob.style.transform=
                "translate(0,0)";

            moveX=0;
            moveZ=0;

        },
        {passive:true}
    );


    $("attack-btn").addEventListener(
        "touchstart",
        attack,
        {passive:true}
    );

    $("attack-btn").addEventListener(
        "click",
        attack
    );


    $("skill-btn").addEventListener(
        "click",
        ultimate
    );

    $("skill-btn").addEventListener(
        "touchstart",
        ultimate,
        {passive:true}
    );


    $("restart-btn").addEventListener(
        "click",
        restartGame
    );
}


/* =========================
   ATTACK
========================= */

function attack(){

    if(
        gameOver ||
        attackCooldown>0 ||
        isAttacking
    )return;

    isAttacking=true;

    attackCooldown=
        weaponStats[currentWeapon]
        .cooldown;

    weaponRotation=0;
}


/* =========================
   ULTIMATE
========================= */

function ultimate(){

    if(
        gameOver ||
        ultCooldown>0
    )return;

    ultCooldown=300;

    createShockwave();

    for(let i=zombies.length-1;i>=0;i--){

        const z=zombies[i];

        if(
            player.position.distanceTo(
                z.position
            )<=7
        ){

            z.userData.hp-=5;

            createParticles(
                z.position,
                0x9900ff,
                15
            );

            killZombieIfNeeded(
                z,
                i
            );
        }
    }
}


/* =========================
   SHOCKWAVE
========================= */

function createShockwave(){

    const mesh=
        new THREE.Mesh(
            new THREE.RingGeometry(
                .1,.5,32
            ),
            new THREE.MeshBasicMaterial({
                color:0x9900ff,
                transparent:true,
                opacity:.9,
                side:THREE.DoubleSide
            })
        );

    mesh.rotation.x=
        -Math.PI/2;

    mesh.position.copy(
        player.position
    );

    mesh.position.y=.08;

    mesh.userData.life=30;

    scene.add(mesh);

    particles.push(mesh);
}


/* =========================
   ZOMBIES
========================= */

function spawnZombie(){

    if(
        gameOver ||
        zombies.length>=20
    )return;


    const z=
        new THREE.Group();


    const body=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .3,.2,1,6
            ),
            new THREE.MeshStandardMaterial({
                color:0x245d36
            })
        );

    body.position.y=.5;


    const head=
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                .25,0
            ),
            new THREE.MeshStandardMaterial({
                color:0x669955
            })
        );

    head.position.y=1.1;


    const eyeMat=
        new THREE.MeshBasicMaterial({
            color:0xff0000
        });


    const eye1=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .045,6,6
            ),
            eyeMat
        );

    const eye2=eye1.clone();

    eye1.position.set(
        -.08,1.15,-.21
    );

    eye2.position.set(
        .08,1.15,-.21
    );


    z.add(body);
    z.add(head);
    z.add(eye1);
    z.add(eye2);


    const angle=
        Math.random()*Math.PI*2;

    const distance=
        14+Math.random()*10;


    z.position.set(
        player.position.x+
        Math.cos(angle)*distance,

        0,

        player.position.z+
        Math.sin(angle)*distance
    );


    z.userData={
        hp:2,
        speed:.035+
            Math.random()*.025,
        body:body
    };


    scene.add(z);
    zombies.push(z);
}


/* =========================
   PARTICLES
========================= */

function createParticles(
    pos,
    color,
    count
){

    for(let i=0;i<count;i++){

        const p=
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .05,5,5
                ),
                new THREE.MeshBasicMaterial({
                    color:color
                })
            );


        p.position.copy(pos);

        p.position.y+=.5;


        p.userData={
            vx:(Math.random()-.5)*.18,
            vy:Math.random()*.16+.03,
            vz:(Math.random()-.5)*.18,
            life:20+Math.random()*15
        };


        scene.add(p);
        particles.push(p);
    }
}


/* =========================
   LOOT
========================= */

function spawnLoot(pos){

    if(Math.random()>.45)return;


    const medkit=
        Math.random()>.5;


    const d=
        new THREE.Mesh(
            medkit
            ?new THREE.BoxGeometry(
                .45,.35,.25
            )
            :new THREE.OctahedronGeometry(
                .3
            ),

            new THREE.MeshStandardMaterial({
                color:
                    medkit
                    ?0xffffff
                    :0x9900ff,

                emissive:
                    medkit
                    ?0x000000
                    :0x4400aa
            })
        );


    d.position.set(
        pos.x,.4,pos.z
    );


    d.userData={
        type:medkit
            ?"heal"
            :"points"
    };


    scene.add(d);
    drops.push(d);
}


/* =========================
   KILL ZOMBIE
========================= */

function killZombieIfNeeded(
    zombie,
    index
){

    if(
        zombie.userData.hp>0
    )return;


    spawnLoot(
        zombie.position
    );

    createParticles(
        zombie.position,
        0xff0055,
        10
    );


    scene.remove(zombie);

    zombies.splice(
        index,
        1
    );


    score+=100;

    updateHUD();
}


/* =========================
   HITBOX
========================= */

function checkHitbox(){

    const stats=
        weaponStats[currentWeapon];

    let hit=false;


    for(
        let i=zombies.length-1;
        i>=0;
        i--
    ){

        const z=zombies[i];


        if(
            player.position.distanceTo(
                z.position
            )<=stats.range
        ){

            z.userData.hp-=stats.damage;

            createParticles(
                z.position,
                stats.color,
                8
            );

            killZombieIfNeeded(
                z,
                i
            );

            hit=true;
        }
    }


    return hit;
}


/* =========================
   GAME LOOP
========================= */

function animate(){

    if(!gameRunning)return;

    requestAnimationFrame(
        animate
    );


    const time=
        clock.getElapsedTime();


    /* PLAYER MOVEMENT */

    if(
        Math.abs(moveX)>.01 ||
        Math.abs(moveZ)>.01
    ){

        const speed=.12;

        player.position.x+=
            moveX*speed;

        player.position.z+=
            moveZ*speed;


        playerBody.rotation.y=
            Math.atan2(
                -moveX,
                -moveZ
            );


        leftLeg.rotation.x=
            Math.sin(time*12)*.65;

        rightLeg.rotation.x=
            -Math.sin(time*12)*.65;

    }else{

        leftLeg.rotation.x=0;
        rightLeg.rotation.x=0;

    }


    /* CAMERA */

    camera.position.x=
        player.position.x;

    camera.position.z=
        player.position.z+8.5;

    camera.position.y=11;

    camera.lookAt(
        player.position.x,
        0,
        player.position.z
    );


    /* ATTACK */

    if(
        attackCooldown>0
    ){
        attackCooldown--;
    }


    if(isAttacking){

        weaponRotation+=.45;

        weaponMesh.rotation.z=
            weaponRotation;


        if(
            weaponRotation>=Math.PI
        ){

            checkHitbox();

            weaponMesh.rotation.z=0;

            isAttacking=false;
        }
    }


    /* ULT COOLDOWN */

    if(ultCooldown>0){

        ultCooldown--;

        $("skill-cd").style.display=
            "flex";

        $("skill-cd").textContent=
            Math.ceil(
                ultCooldown/60
            );

    }else{

        $("skill-cd").style.display=
            "none";
    }


    /* ZOMBIE AI */

    for(
        let i=zombies.length-1;
        i>=0;
        i--
    ){

        const z=zombies[i];

        z.lookAt(
            player.position.x,
            0,
            player.position.z
        );


        const dist=
            z.position.distanceTo(
                player.position
            );


        if(dist>1.2){

            z.translateZ(
                z.userData.speed
            );

            z.userData.body.rotation.x=
                Math.sin(time*10+i)
                *.2;

        }else{

            z.userData.body.rotation.x=
                Math.sin(time*15)
                *.25;

            playerHp-=.35;

            updateHUD();


            if(
                playerHp<=0
            ){

                endGame();
            }
        }
    }


    /* LOOT */

    for(
        let i=drops.length-1;
        i>=0;
        i--
    ){

        const d=drops[i];

        d.rotation.y+=.04;

        d.position.y=
            .4+
            Math.sin(
                time*4+i
            )*.08;


        if(
            player.position.distanceTo(
                d.position
            )<1.4
        ){

            if(
                d.userData.type==="heal"
            ){

                playerHp=
                    Math.min(
                        100,
                        playerHp+30
                    );

            }else{

                score+=300;
            }


            updateHUD();

            createParticles(
                player.position,
                0x00ffcc,
                8
            );


            scene.remove(d);

            drops.splice(
                i,
                1
            );
        }
    }


    /* PARTICLES */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];


        if(
            p.geometry.type==="RingGeometry"
        ){

            p.scale.x+=.35;
            p.scale.y+=.35;

            p.material.opacity-=.04;

            if(
                p.material.opacity<=0
            ){

                scene.remove(p);

                particles.splice(
                    i,
                    1
                );
            }

        }else{

            p.position.x+=
                p.userData.vx;

            p.position.y+=
                p.userData.vy;

            p.position.z+=
                p.userData.vz;

            p.userData.vy-=.007;

            p.userData.life--;


            if(
                p.userData.life<=0
            ){

                scene.remove(p);

                particles.splice(
                    i,
                    1
                );
            }
        }
    }


    /* SPAWN */

    spawnTimer++;

    if(
        spawnTimer>70
    ){

        spawnZombie();

        spawnTimer=0;
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================
   HUD
========================= */

function updateHUD(){

    $("hp-bar").style.width=
        Math.max(
            0,
            playerHp
        )+"%";

    $("score-val").textContent=
        String(score)
        .padStart(4,"0");
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    if(gameOver)return;

    gameOver=true;

    $("final-score").textContent=
        "TOTAL ENERGY: "+score;

    $("game-over-screen")
        .style.display="flex";
}


/* =========================
   RESTART
========================= */

function restartGame(){

    zombies.forEach(
        z=>scene.remove(z)
    );

    particles.forEach(
        p=>scene.remove(p)
    );

    drops.forEach(
        d=>scene.remove(d)
    );


    zombies=[];
    particles=[];
    drops=[];


    playerHp=100;
    score=0;

    attackCooldown=0;
    ultCooldown=0;

    isAttacking=false;

    spawnTimer=0;

    player.position.set(
        0,0,0
    );

    playerBody.rotation.y=0;


    updateHUD();


    $("game-over-screen")
        .style.display="none";


    gameOver=false;
    gameRunning=true;

    clock.start();
}


/* =========================
   RESIZE
========================= */

function resizeGame(){

    if(!camera || !renderer)
        return;

    camera.aspect=
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

</script>
