<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ultimate Web OS Developer Hub v3.1</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(6, 182, 212, 0.08), transparent 30%),
                radial-gradient(circle at 90% 10%, rgba(217, 70, 239, 0.08), transparent 30%),
                #070a13;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .code-font {
            font-family: 'Fira Code', monospace;
        }

        .cyber-panel {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.20);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.37),
                inset 0 1px 0 rgba(255,255,255,0.02);
        }

        .neon-glow-cyan:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .neon-border-glow {
            position: relative;
            overflow: hidden;
        }

        .neon-border-glow::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(
                135deg,
                #06b6d4,
                #d946ef
            );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;
            mask-composite: exclude;

            pointer-events: none;
            opacity: 0.45;
            transition: opacity 0.3s;
        }

        .neon-border-glow:hover::after {
            opacity: 1;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }

        .preview-container {
            transition:
                width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .line-numbers {
            min-width: 46px;
            user-select: none;
            overflow: hidden;
        }

        .editor-wrap {
            min-height: 430px;
        }

        .editor-textarea {
            tab-size: 2;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            display: inline-block;
        }

        .status-online {
            background: #22c55e;
            box-shadow: 0 0 12px rgba(34,197,94,.8);
        }

        .status-error {
            background: #ef4444;
            box-shadow: 0 0 12px rgba(239,68,68,.8);
        }

        .status-running {
            background: #06b6d4;
            box-shadow: 0 0 12px rgba(6,182,212,.8);
        }

        .device-frame {
            background: #020617;
            border: 1px solid #1e293b;
            box-shadow:
                0 20px 60px rgba(0,0,0,.45),
                0 0 30px rgba(6,182,212,.06);
        }

        .console-line {
            word-break: break-word;
            white-space: pre-wrap;
        }

        .toast {
            transition:
                transform .25s ease,
                opacity .25s ease;
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin-slow {
            animation: spin-slow 10s linear infinite;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px !important;
            }

            .editor-wrap {
                min-height: 360px;
            }
        }
    </style>
</head>

<body class="p-4 min-h-screen flex flex-col gap-4">

    <!-- =========================================================

                <div>
                    <h1

        >
            <span id="toast-text"></span>
        </div>

    </div>


<script>
/* ============================================================
   GLOBAL STATE
============================================================ */

let currentTab = 'html';
let projects = {};

const STORAGE_KEY = 'mega_dev_hub_projects_v31';


/* ============================================================
   DOM HELPERS
============================================================ */

function $(id) {
    return document.getElementById(id);
}


/* ============================================================
   TOAST
============================================================ */

function showToast(text) {

    const toast = $('toast');
    const toastText = $('toast-text');

    toastText.textContent = text;

    toast.classList.remove(
        'translate-y-20',
        'opacity-0'
    );

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(() => {

        toast.classList.add(
            'translate-y-20',
            'opacity-0'
        );

    }, 2500);
}


/* ============================================================
   CONSOLE
============================================================ */

function clearConsole() {

    $('console-output').innerHTML =
        '<div class="console-line text-slate-400">' +
        '[System] Console cleared.' +
        '</div>';
}


function consoleMessage(message, type = 'info') {

    const output = $('console-output');

    const line = document.createElement('div');

    line.className = 'console-line';

    if (type === 'error') {
        line.classList.add('text-rose-400');
    }

    else if (type === 'success') {
        line.classList.add('text-emerald-400');
    }

    else if (type === 'warn') {
        line.classList.add('text-amber-400');
    }

    else {
        line.classList.add('text-cyan-400');
    }

    line.textContent = message;

    output.appendChild(line);

    output.scrollTop = output.scrollHeight;
}


/* ============================================================
   STATUS
============================================================ */

function setStatus(type, text) {

    const dot = $('statusDot');

    dot.classList.remove(
        'status-online',
        'status-error',
        'status-running'
    );

    if (type === 'error') {
        dot.classList.add('status-error');
    }

    else if (type === 'running') {
        dot.classList.add('status-running');
    }

    else {
        dot.classList.add('status-online');
    }

    $('statusText').textContent = text;
}


/* ============================================================
   TAB SYSTEM
============================================================ */

function switchTab(tab) {

    currentTab = tab;

    ['html', 'css', 'js'].forEach(t => {

        const editor = $(`code-${t}`);
        const button = $(`tab-${t}`);

        editor.classList.add('hidden');

        button.className =
            'px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white';

    });

    $(`code-${tab}`).classList.remove('hidden');

    $(`tab-${tab}`).className =
        'px-3 py-1 rounded text-xs font-medium bg-slate-800 text-cyan-400 border border-cyan-500/30';

    updateLineNumbers();
}


/* ============================================================
   LINE NUMBERS
============================================================ */

function updateLineNumbers() {

    const textarea = $(`code-${currentTab}`);

    if (!textarea) return;

    const count = Math.max(
        textarea.value.split('\n').length,
        1
    );

    let html = '';

    for (let i = 1; i <= count; i++) {
        html += i + '<br>';
    }

    $('lineNumbers').innerHTML = html;
}


/* ============================================================
   VIEWPORT
============================================================ */

function changeViewport(mode) {

    const wrapper = $('viewport-wrapper');

    ['desktop', 'tablet', 'mobile'].forEach(m => {

        $(`btn-view-${m}`).className =
            'px-3 py-1.5 rounded-md text-xs font-semibold text-slate-400 hover:text-white transition-all';

    });

    $(`btn-view-${mode}`).className =
        'px-3 py-1.5 rounded-md text-xs font-semibold bg-cyan-600 text-white transition-all';


    if (mode === 'desktop') {

        wrapper.style.width = '100%';
        wrapper.style.height = '100%';
        wrapper.style.minHeight = '430px';

    }

    else if (mode === 'tablet') {

        wrapper.style.width = '768px';
        wrapper.style.maxWidth = '100%';
        wrapper.style.height = '520px';
        wrapper.style.minHeight = '520px';

    }

    else if (mode === 'mobile') {

        wrapper.style.width = '375px';
        wrapper.style.maxWidth = '100%';
        wrapper.style.height = '667px';
        wrapper.style.minHeight = '667px';

    }

    showToast(
        `เปลี่ยน Preview เป็น ${mode.toUpperCase()} แล้ว`
    );
}


/* ============================================================
   BUILD HTML
============================================================ */

function buildHtmlDocument(html, css, js) {

    return `<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
    margin:0;
    min-height:100%;
}

${css}
</style>

<script>

(function(){

    function send(type, msg){

        try{

            parent.postMessage({
                source: 'WEB_OS_DEV_HUB',
                type: type,
                msg: String(msg)
            }, '*');

        }catch(e){}

    }


    window.onerror = function(
        message,
        source,
        lineno,
        colno,
        error
    ){

        send(
            'error',
            message + ' (บรรทัด ' + lineno + ')'
        );

        return false;
    };


    window.addEventListener(
        'unhandledrejection',
        function(event){

            send(
                'error',
                'Unhandled Promise Rejection: ' +
                (event.reason || 'Unknown error')
            );

        }
    );


    const originalLog = console.log;

    console.log = function(){

        const args =
            Array.from(arguments)
                .map(x => {

                    try {
                        return typeof x === 'object'
                            ? JSON.stringify(x)
                            : String(x);
                    }

                    catch(e) {
                        return String(x);
                    }

                });

        send(
            'log',
            args.join(' ')
        );

        originalLog.apply(console, arguments);
    };


    const originalWarn = console.warn;

    console.warn = function(){

        const args =
            Array.from(arguments)
                .map(String);

        send(
            'warn',
            args.join(' ')
        );

        originalWarn.apply(console, arguments);
    };

})();

<\/script>

</head>

<body>

${html}

<script>
try {

${js}

} catch(error) {

    parent.postMessage({
        source: 'WEB_OS_DEV_HUB',
        type: 'error',
        msg: error.message
    }, '*');

}
<\/script>

</body>
</html>`;
}


/* ============================================================
   EXECUTE HTML
============================================================ */

function executeCode() {

    const lang = $('languageSelect').value;

    const iframe = $('preview-screen');

    setStatus(
        'running',
        'RUNNING'
    );

    $('console-output').innerHTML = '';

    consoleMessage(
        '[System] กำลังประมวลผลโค้ด...',
        'info'
    );


    if (lang !== 'html') {

        runLanguageSimulation(lang);

        return;
    }


    const html = $('code-html').value;

    const css = $('code-css').value;

    const js = $('code-js').value;


    try {

        const documentSource =
            buildHtmlDocument(
                html,
                css,
                js
            );

        iframe.srcdoc = documentSource;

        setTimeout(() => {

            setStatus(
                'online',
                'READY'

/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


/* ============================================================
   MESSAGE FROM IFRAME
============================================================ */

window.addEventListener(
    'message',
    function(event){

        const data = event.data;

        if (
            !data ||
            data.source !== 'WEB_OS_DEV_HUB'
        ) {
            return;
        }


        if (data.type === 'error') {

            setStatus(
                'error',
                'RUNTIME ERROR'
            );

            consoleMessage(
                '⚠️ Error: ' + data.msg,
                'error'
            );

        }

        else if (data.type === 'log') {

            consoleMessage(
                '➜ Log: ' + data.msg,
                'info'
            );

        }

        else if (data.type === 'warn') {

            consoleMessage(
                '⚠️ Warning: ' + data.msg,
                'warn'
            );

        }

    }
);


/* ============================================================
   STORAGE
============================================================ */

function loadProjectsFromStorage() {

    try {

        const cached =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!cached) {

            projects = {};

            return;
        }


        const parsed =
            JSON.parse(cached);


        if (
            parsed &&
            typeof parsed === 'object' &&
            !Array.isArray(parsed)
        ) {

            projects = parsed;

        }

        else {

            projects = {};

        }

    }

    catch(error) {

        projects = {};

        consoleMessage(
            '[Storage] ไม่สามารถอ่านฐานข้อมูลเดิมได้',
            'warn'
        );

    }
}


function persistProjects() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(projects)
        );

        return true;

    }

    catch(error) {

        consoleMessage(
            '[Storage Error] ' + error.message,
            'error'
        );

        return false;
    }
}

        );

        );

    }

    catch(error) {

/* ============================================================
   FALLBACK COPY
============================================================ */

function fallbackCopy(text) {

    const textarea =
        document.createElement('textarea');

    textarea.value = text;

    textarea.style.position =
        'fixed';

    textarea.style.opacity =
        '0';

    document.body.appendChild(
        textarea
    );

    textarea.select();

    try {

        document.execCommand(
            'copy'
        );

        showToast(
            '📋 คัดลอกโค้ดแล้ว'
        );

    }

    catch(error) {

        showToast(
            '❌ ไม่สามารถคัดลอกอัตโนมัติได้'
        );

    }

    document.body.removeChild(
        textarea
    );
}

function downloadCode() {

    const html =
        $('code-html').value;

    const css =
        $('code-css').value;

    const js =
        $('code-js').value;


    const combined =
`<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>My Web Project</title>

<style>

${css}

</style>

</head>

<body>

${html}

<script>

${js}

<\/script>

</body>

</html>`;


    const blob =
        new Blob(
            [combined],
            {
                type:
                    'text/html;charset=utf-8'
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement('a');


    const projectName =
        $('projectName')
            .value
            .trim()
            .replace(
                /[<>:"/\\|?*]+/g,
                '_'
            );


    link.href = url;

    link.download =
        (projectName || 'index') +
        '.html';


    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );


    setTimeout(
        () => URL.revokeObjectURL(url),
        1000
    );


    showToast(
        '📥 ดาวน์โหลด HTML สำเร็จ'
    );
}
