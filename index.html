<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web & App Code Shielder V2</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        .neon-border {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.20);
        }

        .neon-glow {
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.50);
        }

        textarea,
        #outputArea {
            scrollbar-width: thin;
            scrollbar-color: #334155 #070a12;
        }

        textarea::-webkit-scrollbar,
        #outputArea::-webkit-scrollbar {
            width: 7px;
        }

        textarea::-webkit-scrollbar-track,
        #outputArea::-webkit-scrollbar-track {
            background: #070a12;
        }

        textarea::-webkit-scrollbar-thumb,
        #outputArea::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .btn-click {
            transition: transform 0.12s ease;
        }

        .btn-click:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body class="bg-[#0b0f19] text-slate-200 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="border-b border-slate-800 bg-[#0f172a]/90 backdrop-blur sticky top-0 z-50">

        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">

            <div class="flex items-center gap-3">

                <div class="bg-gradient-to-tr from-indigo-600 to-violet-600
                            p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/20">

                    <i class="fa-solid fa-user-shield text-xl animate-pulse"></i>

                </div>

                <div>

                    <h1 class="text-xl font-extrabold tracking-wide
                               bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400
                               bg-clip-text text-transparent">

                        CODE SHIELD V2

                    </h1>

                    <p class="text-xs text-cyan-400 font-mono neon-glow">
                        แปลงโค้ดเป็นชุดตัวเลขและสามารถถอดกลับได้
                    </p>

                </div>

            </div>

            <div class="hidden sm:flex items-center gap-2 bg-slate-900
                        border border-slate-800 px-3 py-1.5 rounded-lg text-xs">

                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex
                                 h-full w-full rounded-full bg-emerald-400 opacity-75"></span>

                    <span class="relative inline-flex rounded-full
                                 h-2 w-2 bg-emerald-500"></span>
                </span>

                <span class="text-slate-400 font-mono">
                    ENGINE READY
                </span>

            </div>

        </div>

    </header>


    <!-- MAIN -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow
                 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT -->
        <div class="lg:col-span-5 flex flex-col gap-5">

            <!-- INPUT -->
            <div class="bg-[#111827]/90 border border-slate-800
                        rounded-2xl p-5 shadow-2xl flex flex-col
                        h-[320px] neon-border">

                <div class="flex items-center justify-between mb-3">

                    <div class="flex items-center gap-2">

                        <i class="fa-solid fa-code text-indigo-400 text-sm"></i>

                        <h2 class="text-sm font-semibold text-slate-300">
                            1. วางโค้ดเว็บ/แอป
                        </h2>

                    </div>

                    <button
                        type="button"
                        onclick="clearInput()"
                        class="text-xs text-rose-400 hover:text-rose-300
                               transition-all flex items-center gap-1">

                        <i class="fa-solid fa-eraser"></i>

                        <span>ลบออก</span>

                    </button>

                </div>

                <textarea
                    id="rawCodeInput"
                    spellcheck="false"
                    placeholder="วาง HTML, CSS, JavaScript หรือโค้ดของคุณที่นี่..."
                    class="w-full flex-grow bg-[#070a12]
                           border border-slate-800 rounded-xl p-3
                           font-mono text-xs text-indigo-300
                           placeholder-slate-600
                           focus:ring-2 focus:ring-indigo-500
                           focus:outline-none resize-none
                           transition-all"
                ></textarea>

            </div>


            <!-- CONTROL -->
            <div class="bg-[#111827]/90 border border-slate-800
                        rounded-2xl p-5 shadow-2xl flex flex-col gap-4">

                <h2 class="text-sm font-semibold text-slate-300
                           flex items-center gap-2">

                    <i class="fa-solid fa-gears text-purple-400"></i>

                    <span>2. แผงควบคุม</span>

                </h2>


                <div class="grid grid-cols-2 gap-3">

                    <button
                        type="button"
                        onclick="encryptCodeToNumbers()"
                        class="btn-click bg-gradient-to-r from-indigo-600
                               to-indigo-500 hover:from-indigo-500
                               hover:to-indigo-400 text-white font-semibold
                               py-3 px-4 rounded-xl shadow-lg
                               shadow-indigo-600/20 transition-all
                               flex flex-col items-center justify-center gap-1">

                        <i class="fa-solid fa-lock text-lg"></i>

                        <span class="text-xs">
                            เข้ารหัสเป็นตัวเลข
                        </span>

                    </button>


                    <button
                        type="button"
                        onclick="decryptNumbersToPreview()"
                        class="btn-click bg-gradient-to-r from-emerald-600
                               to-cyan-600 hover:from-emerald-500
                               hover:to-cyan-500 text-white font-semibold
                               py-3 px-4 rounded-xl shadow-lg
                               shadow-emerald-600/20 transition-all
                               flex flex-col items-center justify-center gap-1">

                        <i class="fa-solid fa-laptop-code text-lg"></i>

                        <span class="text-xs">
                            ถอดรหัสและ Preview
                        </span>

                    </button>

                </div>


                <button
                    type="button"
                    onclick="clearEverything()"
                    class="btn-click w-full bg-slate-800
                           hover:bg-rose-950/40 hover:text-rose-400
                           border border-slate-700/60 text-slate-400
                           py-2.5 rounded-xl text-xs font-medium
                           transition-all flex items-center
                           justify-center gap-2">

                    <i class="fa-solid fa-trash-can"></i>

                    <span>
                        เคลียร์ทั้งหมด
                    </span>

                </button>

            </div>

        </div>


        <!-- RIGHT -->
        <div class="lg:col-span-7 flex flex-col gap-5">

            <!-- OUTPUT -->
            <div class="bg-[#111827]/90 border border-slate-800
                        rounded-2xl p-5 shadow-2xl flex flex-col
                        h-[220px] neon-border">

                <div class="flex items-center justify-between mb-3">

                    <div class="flex items-center gap-2">

                        <i class="fa-solid fa-hashtag text-cyan-400 text-sm"></i>

                        <h2 class="text-sm font-semibold text-slate-300">
                            3. ชุดตัวเลข
                        </h2>

                    </div>


                    <div class="flex gap-2">

                        <button
                            type="button"
                            onclick="copyOutput()"
                            class="text-xs bg-slate-800
                                   border border-slate-700
                                   text-cyan-400 px-3 py-1
                                   rounded-lg hover:bg-cyan-500
                                   hover:text-slate-950
                                   transition-all flex items-center gap-1">

                            <i class="fa-regular fa-copy"></i>

                            <span id="copyBtnTxt">
                                คัดลอก
                            </span>

                        </button>


                        <button
                            type="button"
                            onclick="clearOutput()"
                            class="text-xs text-slate-500
                                   hover:text-slate-300 p-1">

                            <i class="fa-solid fa-xmark"></i>

                        </button>

                    </div>

                </div>


                <div
                    id="outputArea"
                    class="w-full flex-grow bg-[#070a12]
                           border border-slate-800 rounded-xl
                           p-3 font-mono text-xs
                           overflow-y-auto whitespace-pre-wrap
                           break-all text-cyan-400 select-all"
                >

                    <span class="text-slate-600 italic">
                        เมื่อกด "เข้ารหัสเป็นตัวเลข"
                        ชุดตัวเลขจะแสดงที่นี่...
                    </span>

                </div>

            </div>


            <!-- PREVIEW -->
            <div class="bg-[#111827]/90 border border-slate-800
                        rounded-2xl p-5 shadow-2xl flex flex-col
                        h-[340px] relative">

                <div class="flex items-center justify-between mb-3">

                    <div class="flex items-center gap-2">

                        <i class="fa-solid fa-eye text-emerald-400 text-sm"></i>

                        <h2 class="text-sm font-semibold text-slate-300">
                            4. Live Web App Preview
                        </h2>

                    </div>


                    <div class="flex items-center gap-1.5">

                        <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>

                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>

                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>

                    </div>

                </div>


                <div
                    class="w-full flex-grow bg-white
                           border border-slate-200
                           rounded-xl overflow-hidden shadow-inner"
                >

                    <iframe
                        id="appPreviewFrame"
                        title="Application Preview"
                        class="w-full h-full bg-white"
                        sandbox="allow-scripts"
                    ></iframe>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer
        class="border-t border-slate-900 bg-[#070a12]
               py-3 text-center text-xs text-slate-600 font-mono"
    >

        <p>
            🔒 CODE SHIELD V2 © 2026
        </p>

    </footer>


<script>

    /*
     * =========================================================
     * CODE SHIELD V2
     * =========================================================
     *
     * ระบบนี้เป็นการ encode ข้อมูลเป็นตัวเลข
     * ไม่ใช่ encryption ที่ปลอดภัยสำหรับเก็บความลับจริง
     *
     * สูตร:
     *
     * ตัวเลข = UTF-16 code unit × 3 + 7
     *
     * ถอดกลับ:
     *
     * UTF-16 code unit = (ตัวเลข - 7) / 3
     *
     * =========================================================
     */


    const PLACEHOLDER_TEXT =
        "เมื่อกด \"เข้ารหัสเป็นตัวเลข\" ชุดตัวเลขจะแสดงที่นี่...";


    /*
     * ---------------------------------------------------------
     * 1. เข้ารหัสโค้ดเป็นตัวเลข
     * ---------------------------------------------------------
     */

    function encryptCodeToNumbers() {

        const input =
            document.getElementById("rawCodeInput");

        const output =
            document.getElementById("outputArea");


        const rawCode = input.value;


        if (!rawCode.trim()) {

            showMessage(
                "กรุณาวางโค้ดก่อนครับ",
                "error"
            );

            input.focus();

            return;
        }


        try {

            const numberSequence = [];


            /*
             * ใช้ charCodeAt เพื่อเก็บข้อมูล UTF-16
             * จึงสามารถเก็บ HTML / JS / CSS และภาษาไทยได้
             */

            for (let i = 0; i < rawCode.length; i++) {

                const code = rawCode.charCodeAt(i);

                const encoded = code * 3 + 7;

                numberSequence.push(encoded);

            }


            output.textContent =
                numberSequence.join("-");


        } catch (error) {

            console.error(error);

            showMessage(
                "ไม่สามารถเข้ารหัสข้อมูลได้",
                "error"
            );

        }

    }


    /*
     * ---------------------------------------------------------
     * 2. ถอดตัวเลขกลับเป็นโค้ด
     * ---------------------------------------------------------
     */

    function decodeNumbers(numberText) {

        const parts =
            numberText
                .trim()
                .split("-");


        let decodedCode = "";


        for (let i = 0; i < parts.length; i++) {

            const part = parts[i].trim();


            if (part === "") {
                continue;
            }


            /*
             * ต้องเป็นตัวเลขจำนวนเต็มเท่านั้น
             */

            if (!/^\d+$/.test(part)) {

                throw new Error(
                    "พบข้อมูลที่ไม่ใช่ตัวเลข"
                );

            }


            const encoded =
                Number(part);


            if (!Number.isSafeInteger(encoded)) {

                throw new Error(
                    "ตัวเลขมีขนาดใหญ่เกินไป"
                );

            }


            /*
             * ย้อนกลับจากสูตร:
             *
             * original = (encoded - 7) / 3
             */

            const original =
                (encoded - 7) / 3;


            /*
             * ต้องหาร 3 ลงตัว
             */

            if (!Number.isInteger(original)) {

                throw new Error(
                    "ชุดตัวเลขไม่ถูกต้อง"
                );

            }


            /*
             * UTF-16 code unit อยู่ในช่วง 0 - 65535
             */

            if (original < 0 || original > 65535) {

                throw new Error(
                    "พบค่า character ที่ไม่ถูกต้อง"
                );

            }


            decodedCode +=
                String.fromCharCode(original);

        }


        return decodedCode;

    }


    /*
     * ---------------------------------------------------------
     * 3. ถอดรหัสแล้วเปิด Preview
     * ---------------------------------------------------------
     */

    function decryptNumbersToPreview() {

        const output =
            document.getElementById("outputArea");

        const iframe =
            document.getElementById("appPreviewFrame");


        /*
         * textContent ปลอดภัยกว่า innerText
         * สำหรับอ่านข้อความจาก output
         */

        const numberText =
            output.textContent.trim();


        if (
            !numberText ||
            numberText === PLACEHOLDER_TEXT
        ) {

            showMessage(
                "ยังไม่มีชุดตัวเลข กรุณาเข้ารหัสโค้ดก่อนครับ",
                "error"
            );

            return;
        }


        try {

            const decodedCode =
                decodeNumbers(numberText);


            if (!decodedCode) {

                throw new Error(
                    "ไม่พบโค้ดหลังจากถอดรหัส"
                );

            }


            /*
             * สร้าง Blob URL แทน document.write
             *
             * วิธีนี้เสถียรกว่าเมื่อ HTML
             * มี script หรือ document structure ซับซ้อน
             */

            const blob =
                new Blob(
                    [decodedCode],
                    {
                        type: "text/html;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            /*
             * ล้าง URL เก่า
             */

            if (iframe.dataset.blobUrl) {

                URL.revokeObjectURL(
                    iframe.dataset.blobUrl
                );

            }


            iframe.dataset.blobUrl = url;

            iframe.src = url;


            /*
             * ปลด URL เมื่อโหลดเข้า iframe แล้ว
             * แต่ยังเก็บ dataset ไว้เพื่อใช้ล้างรอบถัดไป
             */

            showMessage(
                "ถอดรหัสสำเร็จ ✓",
                "success"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "ชุดตัวเลขไม่ถูกต้อง หรือข้อมูลเสียหาย",
                "error"
            );

        }

    }


    /*
     * ---------------------------------------------------------
     * 4. Clear Input
     * ---------------------------------------------------------
     */

    function clearInput() {

        document.getElementById(
            "rawCodeInput"
        ).value = "";

    }


    /*
     * ---------------------------------------------------------
     * 5. Clear Output
     * ---------------------------------------------------------
     */

    function clearOutput() {

        document.getElementById(
            "outputArea"
        ).innerHTML =
            `<span class="text-slate-600 italic">
                ${PLACEHOLDER_TEXT}
            </span>`;

    }


    /*
     * ---------------------------------------------------------
     * 6. Clear Preview
     * ---------------------------------------------------------
     */

    function clearPreview() {

        const iframe =
            document.getElementById(
                "appPreviewFrame"
            );


        if (iframe.dataset.blobUrl) {

            URL.revokeObjectURL(
                iframe.dataset.blobUrl
            );

            delete iframe.dataset.blobUrl;

        }


        iframe.src = "about:blank";

    }


    /*
     * ---------------------------------------------------------
     * 7. Clear Everything
     * ---------------------------------------------------------
     */

    function clearEverything() {

        clearInput();

        clearOutput();

        clearPreview();

    }


    /*
     * ---------------------------------------------------------
     * 8. Copy Output
     * ---------------------------------------------------------
     */

    async function copyOutput() {

        const output =
            document.getElementById(
                "outputArea"
            );


        const text =
            output.textContent.trim();


        if (
            !text ||
            text === PLACEHOLDER_TEXT
        ) {

            showMessage(
                "ยังไม่มีตัวเลขให้คัดลอก",
                "error"
            );

            return;
        }


        try {

            await navigator.clipboard.writeText(
                text
            );


            const buttonText =
                document.getElementById(
                    "copyBtnTxt"
                );


            buttonText.textContent =
                "คัดลอกสำเร็จ!";


            setTimeout(() => {

                buttonText.textContent =
                    "คัดลอก";

            }, 2000);


        } catch (error) {

            /*
             * Fallback สำหรับ browser
             * ที่ไม่อนุญาต Clipboard API
             */

            try {

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.value = text;

                textarea.style.position =
                    "fixed";

                textarea.style.opacity =
                    "0";


                document.body.appendChild(
                    textarea
                );


                textarea.select();

                document.execCommand(
                    "copy"
                );


                textarea.remove();


                const buttonText =
                    document.getElementById(
                        "copyBtnTxt"
                    );


                buttonText.textContent =
                    "คัดลอกสำเร็จ!";


                setTimeout(() => {

                    buttonText.textContent =
                        "คัดลอก";

                }, 2000);


            } catch (fallbackError) {

                console.error(
                    fallbackError
                );

                showMessage(
                    "Browser ไม่อนุญาตให้คัดลอกอัตโนมัติ",
                    "error"
                );

            }

        }

    }


    /*
     * ---------------------------------------------------------
     * 9. Notification
     * ---------------------------------------------------------
     */

    function showMessage(message, type) {

        /*
         * ใช้ alert แบบง่ายเพื่อให้รองรับ browser
         * ได้กว้างที่สุด
         */

        if (type === "success") {

            console.log(
                "✓ " + message
            );

        } else {

            alert(message);

        }

    }


    /*
     * ---------------------------------------------------------
     * 10. Keyboard Shortcut
     * Ctrl + Enter = Encode
     * Ctrl + Shift + Enter = Decode / Preview
     * ---------------------------------------------------------
     */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.ctrlKey &&
                event.shiftKey &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                decryptNumbersToPreview();

                return;
            }


            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                encryptCodeToNumbers();

            }

        }
    );


    /*
     * ---------------------------------------------------------
     * 11. เริ่มต้นระบบ
     * ---------------------------------------------------------
     */

    window.addEventListener(
        "load",
        function() {

            console.log(
                "CODE SHIELD V2 ENGINE READY"
            );

        }
    );

</script>

</body>
</html>
