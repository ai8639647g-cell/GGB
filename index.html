<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web & App Code Shielder V3</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        .neon-border {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .neon-glow {
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
        }

        textarea,
        #outputArea {
            scrollbar-width: thin;
            scrollbar-color: #4f46e5 #070a12;
        }

        textarea::-webkit-scrollbar,
        #outputArea::-webkit-scrollbar {
            width: 7px;
        }

        textarea::-webkit-scrollbar-track,
        #outputArea::-webkit-scrollbar-track {
            background: #070a12;
        }

        textarea::-webkit-scrollbar-thumb,
        #outputArea::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-[#0b0f19] text-slate-200 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- HEADER -->
    <header class="border-b border-slate-800 bg-[#0f172a]/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">

            <div class="flex items-center space-x-3">

                <div class="bg-gradient-to-tr from-indigo-600 to-violet-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-user-shield text-xl animate-pulse"></i>
                </div>

                <div>
                    <h1 class="text-xl font-extrabold tracking-wide bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                        CODE SHIELD V3
                    </h1>

                    <p class="text-xs text-cyan-400 font-mono neon-glow">
                        ระบบแปลงโค้ดเป็นตัวเลข + ดาวน์โหลดไฟล์ .txt
                    </p>
                </div>

            </div>

            <div class="hidden sm:flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-xs">

                <span class="h-2 w-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>

                <span class="text-slate-400 font-mono">
                    SECURE DOWNLOAD ON
                </span>

            </div>

        </div>
    </header>


    <!-- MAIN -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT -->
        <div class="lg:col-span-5 flex flex-col gap-5">

            <!-- INPUT -->
            <div class="bg-[#111827]/90 border border-slate-800 rounded-2xl p-5 shadow-2xl flex flex-col h-[320px] neon-border">

                <div class="flex items-center justify-between mb-3">

                    <div class="flex items-center space-x-2">

                        <i class="fa-solid fa-code text-indigo-400 text-sm"></i>

                        <h2 class="text-sm font-semibold text-slate-300">
                            1. วางโค้ดเว็บ/แอป
                        </h2>

                    </div>

                    <button
                        type="button"
                        onclick="clearInput()"
                        class="text-xs text-rose-400 hover:text-rose-300 transition-all flex items-center space-x-1"
                    >
                        <i class="fa-solid fa-eraser"></i>
                        <span>ลบออก</span>
                    </button>

                </div>

                <textarea
                    id="rawCodeInput"
                    placeholder="<!-- วาง HTML, CSS, JS หรือโค้ดเว็บของคุณที่นี่ -->"
                    class="w-full flex-grow bg-[#070a12] border border-slate-800 rounded-xl p-3 font-mono text-xs text-indigo-300 placeholder-slate-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none transition-all"
                    spellcheck="false"
                ></textarea>

            </div>


            <!-- CONTROL -->
            <div class="bg-[#111827]/90 border border-slate-800 rounded-2xl p-5 shadow-2xl flex flex-col gap-4">

                <h2 class="text-sm font-semibold text-slate-300 flex items-center space-x-2">

                    <i class="fa-solid fa-gears text-purple-400"></i>

                    <span>
                        2. แผงควบคุมระบบ
                    </span>

                </h2>


                <div class="grid grid-cols-2 gap-3">

                    <!-- ENCRYPT -->
                    <button
                        type="button"
                        onclick="encryptCodeToNumbers()"
                        class="bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/20 transition-all flex flex-col items-center justify-center gap-1 active:scale-95 group"
                    >

                        <i class="fa-solid fa-lock text-lg group-hover:scale-110 transition-transform"></i>

                        <span class="text-xs">
                            แปลงเป็นตัวเลข
                        </span>

                    </button>


                    <!-- DECRYPT -->
                    <button
                        type="button"
                        onclick="decryptNumbersToPreview()"
                        class="bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all flex flex-col items-center justify-center gap-1 active:scale-95 group"
                    >

                        <i class="fa-solid fa-laptop-code text-lg group-hover:scale-110 transition-transform"></i>

                        <span class="text-xs">
                            ถอดรหัส / Preview
                        </span>

                    </button>

                </div>


                <!-- CLEAR ALL -->
                <button
                    type="button"
                    onclick="clearEverything()"
                    class="w-full bg-slate-800 hover:bg-rose-950/40 hover:text-rose-400 border border-slate-700/60 text-slate-400 py-2.5 rounded-xl text-xs font-medium transition-all active:scale-95 flex items-center justify-center space-x-2"
                >

                    <i class="fa-solid fa-trash-can"></i>

                    <span>
                        เคลียร์ทั้งหมด
                    </span>

                </button>

            </div>

        </div>


        <!-- RIGHT -->
        <div class="lg:col-span-7 flex flex-col gap-5">

            <!-- OUTPUT -->
            <div class="bg-[#111827]/90 border border-slate-800 rounded-2xl p-5 shadow-2xl flex flex-col h-[220px] neon-border">

                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">

                    <div class="flex items-center space-x-2">

                        <i class="fa-solid fa-hashtag text-cyan-400 text-sm"></i>

                        <h2 class="text-sm font-semibold text-slate-300">
                            3. ชุดตัวเลข
                        </h2>

                    </div>


                    <div class="flex flex-wrap gap-2">

                        <!-- DOWNLOAD -->
                        <button
                            type="button"
                            onclick="downloadAsTxtFile()"
                            class="text-xs bg-indigo-950/60 border border-indigo-700/50 text-indigo-300 px-3 py-1.5 rounded-lg hover:bg-indigo-600 hover:text-white transition-all flex items-center space-x-1"
                        >

                            <i class="fa-solid fa-file-arrow-down"></i>

                            <span id="downloadBtnTxt">
                                ดาวน์โหลด .txt
                            </span>

                        </button>


                        <!-- COPY -->
                        <button
                            type="button"
                            onclick="copyOutput()"
                            class="text-xs bg-slate-800 border border-slate-700 text-cyan-400 px-3 py-1.5 rounded-lg hover:bg-cyan-500 hover:text-slate-950 transition-all flex items-center space-x-1"
                        >

                            <i class="fa-regular fa-copy"></i>

                            <span id="copyBtnTxt">
                                คัดลอก
                            </span>

                        </button>


                        <!-- CLEAR OUTPUT -->
                        <button
                            type="button"
                            onclick="clearOutput()"
                            class="text-xs text-slate-500 hover:text-rose-400 p-1"
                            title="ล้างผลลัพธ์"
                        >

                            <i class="fa-solid fa-xmark"></i>

                        </button>

                    </div>

                </div>


                <div
                    id="outputArea"
                    class="w-full flex-grow bg-[#070a12] border border-slate-800 rounded-xl p-3 font-mono text-xs overflow-y-auto whitespace-pre-wrap break-all text-cyan-400 select-all"
                >
                    <span class="text-slate-600 italic">
                        เมื่อกดแปลง โค้ดจะกลายเป็นชุดตัวเลขตรงนี้...
                    </span>
                </div>

            </div>


            <!-- PREVIEW -->
            <div class="bg-[#111827]/90 border border-slate-800 rounded-2xl p-5 shadow-2xl flex flex-col h-[340px] relative">

                <div class="flex items-center justify-between mb-3">

                    <div class="flex items-center space-x-2">

                        <i class="fa-solid fa-eye text-emerald-400 text-sm"></i>

                        <h2 class="text-sm font-semibold text-slate-300">
                            4. Live Web App Preview
                        </h2>

                    </div>


                    <div class="flex items-center space-x-1.5">

                        <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>

                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>

                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>

                    </div>

                </div>


                <div class="w-full flex-grow bg-white border border-slate-200 rounded-xl overflow-hidden shadow-inner">

                    <iframe
                        id="appPreviewFrame"
                        class="w-full h-full bg-white"
                        sandbox="allow-scripts"
                        title="Application Preview"
                    ></iframe>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="border-t border-slate-900 bg-[#070a12] py-3 text-center text-xs text-slate-600 font-mono">

        <p>
            🔒 SECURE CODE DEPLOYMENT SYSTEM &copy; 2026
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script>

        /*
         * ============================================
         * CODE SHIELD V3
         * ============================================
         *
         * รูปแบบการเข้ารหัส:
         *
         * character code × 3 + 7
         *
         * การถอด:
         *
         * (number - 7) / 3
         *
         * หมายเหตุ:
         * วิธีนี้เป็น encoding ไม่ใช่ encryption
         * และไม่ได้ทำให้โค้ดปลอดภัยจากการ reverse engineer
         */


        const PLACEHOLDER_TEXT =
            "เมื่อกดแปลง โค้ดจะกลายเป็นชุดตัวเลขตรงนี้...";


        /*
         * แสดงข้อความใน Output
         */
        function setOutputMessage(message = PLACEHOLDER_TEXT) {

            const outputArea =
                document.getElementById("outputArea");

            outputArea.innerHTML = "";

            const span = document.createElement("span");

            span.className = "text-slate-600 italic";

            span.textContent = message;

            outputArea.appendChild(span);
        }


        /*
         * ตรวจว่ามีข้อมูลตัวเลขจริงหรือไม่
         */
        function getOutputText() {

            const outputArea =
                document.getElementById("outputArea");

            return outputArea.innerText.trim();
        }


        /*
         * 1. ENCODE
         */
        function encryptCodeToNumbers() {

            const rawCode =
                document.getElementById("rawCodeInput").value;

            const outputArea =
                document.getElementById("outputArea");


            if (!rawCode.trim()) {

                alert(
                    "กรุณาวางโค้ด HTML / CSS / JS ก่อนครับ"
                );

                return;
            }


            try {

                const numberSequence = [];


                for (let i = 0; i < rawCode.length; i++) {

                    const charCode =
                        rawCode.charCodeAt(i);

                    const encoded =
                        (charCode * 3) + 7;

                    numberSequence.push(encoded);

                }


                outputArea.textContent =
                    numberSequence.join("-");


            } catch (error) {

                console.error(error);

                alert(
                    "เกิดข้อผิดพลาดระหว่างแปลงโค้ด"
                );

            }

        }


        /*
         * 2. DOWNLOAD TXT
         */
        function downloadAsTxtFile() {

            const outputText =
                getOutputText();


            if (
                !outputText ||
                outputText === PLACEHOLDER_TEXT
            ) {

                alert(
                    "ยังไม่มีชุดตัวเลขให้ดาวน์โหลด กรุณาแปลงโค้ดก่อนครับ"
                );

                return;
            }


            /*
             * ตรวจว่าข้อมูลเป็นตัวเลขจริง
             */
            const validNumberFormat =
                /^\d+(?:-\d+)*$/;


            if (!validNumberFormat.test(outputText)) {

                alert(
                    "ข้อมูลในช่องผลลัพธ์ไม่ใช่ชุดตัวเลขที่ถูกต้อง"
                );

                return;
            }


            try {

                const blob =
                    new Blob(
                        [outputText],
                        {
                            type: "text/plain;charset=utf-8"
                        }
                    );


                const url =
                    URL.createObjectURL(blob);


                const link =
                    document.createElement("a");


                const date =
                    new Date();


                const year =
                    date.getFullYear();


                const month =
                    String(
                        date.getMonth() + 1
                    ).padStart(2, "0");


                const day =
                    String(
                        date.getDate()
                    ).padStart(2, "0");


                link.href = url;


                link.download =
                    `secure-code-${year}-${month}-${day}.txt`;


                document.body.appendChild(link);


                link.click();


                link.remove();


                setTimeout(() => {

                    URL.revokeObjectURL(url);

                }, 1000);


                const buttonText =
                    document.getElementById(
                        "downloadBtnTxt"
                    );


                buttonText.textContent =
                    "ดาวน์โหลดแล้ว!";


                setTimeout(() => {

                    buttonText.textContent =
                        "ดาวน์โหลด .txt";

                }, 2000);


            } catch (error) {

                console.error(error);

                alert(
                    "ไม่สามารถสร้างไฟล์ดาวน์โหลดได้"
                );

            }

        }


        /*
         * 3. DECODE + PREVIEW
         */
        function decryptNumbersToPreview() {

            const outputText =
                getOutputText();


            const iframe =
                document.getElementById(
                    "appPreviewFrame"
                );


            if (
                !outputText ||
                outputText === PLACEHOLDER_TEXT
            ) {

                alert(
                    "ยังไม่มีชุดตัวเลข กรุณาแปลงโค้ดก่อนครับ"
                );

                return;
            }


            /*
             * ตรวจรูปแบบ
             */
            if (!/^\d+(?:-\d+)*$/.test(outputText)) {

                alert(
                    "รูปแบบชุดตัวเลขไม่ถูกต้อง"
                );

                return;
            }


            try {

                const numberArray =
                    outputText.split("-");


                let decodedCode = "";


                for (const numStr of numberArray) {

                    const encodedNumber =
                        Number(numStr);


                    if (!Number.isSafeInteger(encodedNumber)) {

                        throw new Error(
                            "ตัวเลขเกินขอบเขตที่ JavaScript รองรับ"
                        );

                    }


                    const originalCode =
                        (encodedNumber - 7) / 3;


                    /*
                     * ตรวจว่าถอดกลับมาเป็น character code
                     * ที่ถูกต้องหรือไม่
                     */
                    if (
                        !Number.isInteger(originalCode) ||
                        originalCode < 0 ||
                        originalCode > 65535
                    ) {

                        throw new Error(
                            "Invalid encoded value"
                        );

                    }


                    decodedCode +=
                        String.fromCharCode(
                            originalCode
                        );

                }


                /*
                 * โหลด HTML ลง iframe
                 */
                const iframeDoc =
                    iframe.contentDocument ||
                    iframe.contentWindow.document;


                iframeDoc.open();

                iframeDoc.write(decodedCode);

                iframeDoc.close();


            } catch (error) {

                console.error(error);

                alert(
                    "เกิดข้อผิดพลาด: ชุดตัวเลขไม่ถูกต้อง หรือถอดรหัสไม่ได้"
                );

            }

        }


        /*
         * 4. CLEAR INPUT
         */
        function clearInput() {

            document.getElementById(
                "rawCodeInput"
            ).value = "";

        }


        /*
         * 5. CLEAR OUTPUT
         */
        function clearOutput() {

            setOutputMessage();

        }


        /*
         * 6. CLEAR EVERYTHING
         */
        function clearEverything() {

            clearInput();

            clearOutput();


            const iframe =
                document.getElementById(
                    "appPreviewFrame"
                );


            try {

                const iframeDoc =
                    iframe.contentDocument ||
                    iframe.contentWindow.document;


                iframeDoc.open();

                iframeDoc.write("");

                iframeDoc.close();

            } catch (error) {

                console.error(error);

            }

        }


        /*
         * 7. COPY
         */
        async function copyOutput() {

            const textToCopy =
                getOutputText();


            if (
                !textToCopy ||
                textToCopy === PLACEHOLDER_TEXT
            ) {

                alert(
                    "ยังไม่มีข้อมูลให้คัดลอก"
                );

                return;
            }


            try {

                /*
                 * Clipboard API
                 */
                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        textToCopy
                    );

                } else {

                    /*
                     * Fallback สำหรับ browser
                     * ที่ไม่รองรับ Clipboard API
                     */
                    const textarea =
                        document.createElement("textarea");


                    textarea.value =
                        textToCopy;


                    textarea.style.position =
                        "fixed";

                    textarea.style.opacity =
                        "0";


                    document.body.appendChild(
                        textarea
                    );


                    textarea.focus();

                    textarea.select();


                    const successful =
                        document.execCommand("copy");


                    textarea.remove();


                    if (!successful) {

                        throw new Error(
                            "Copy failed"
                        );

                    }

                }


                const buttonText =
                    document.getElementById(
                        "copyBtnTxt"
                    );


                buttonText.textContent =
                    "คัดลอกแล้ว!";


                setTimeout(() => {

                    buttonText.textContent =
                        "คัดลอก";

                }, 2000);


            } catch (error) {

                console.error(error);

                alert(
                    "ไม่สามารถคัดลอกได้ กรุณาเลือกตัวเลขแล้ว Copy เอง"
                );

            }

        }


        /*
         * ============================================
         * INITIALIZE
         * ============================================
         */
        document.addEventListener(
            "DOMContentLoaded",
            () => {

                setOutputMessage();

            }
        );

    </script>

</body>
</html>
