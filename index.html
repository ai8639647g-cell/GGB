<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Local Code Error Fixer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Oxygen,
                Ubuntu,
                Cantarell,
                sans-serif;
        }

        .purple-squiggly-error {
            border-bottom: 2px dashed #c084fc !important;
            background-color: rgba(192, 132, 252, 0.15) !important;
            border-radius: 2px;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .active-scale:active {
            transform: scale(0.98);
        }

        #inputEditorContainer,
        #outputEditorContainer {
            width: 100%;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col p-4 md:p-6">

    <!-- HEADER -->
    <header class="mb-6 flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">
                ✨ Local Code Error Fixer
            </h1>

            <p class="text-sm text-slate-400 mt-1">
                เครื่องมือแก้ไข JavaScript Error แบบ Local
            </p>
        </div>
    </header>

    <!-- MAIN -->
    <div class="flex-1 grid grid-cols-1 xl:grid-cols-2 gap-6">

        <!-- LEFT -->
        <div class="flex flex-col bg-slate-950 rounded-xl border border-slate-800 overflow-hidden shadow-xl">

            <div class="bg-slate-900 px-4 py-3 flex justify-between items-center border-b border-slate-800">

                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                    วางโค้ดที่มี Error ตรงนี้
                </span>

                <div class="flex gap-2">

                    <button
                        id="btnCopyInput"
                        class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-xs text-slate-300 font-medium transition active-scale">
                        📋 คัดลอก
                    </button>

                    <button
                        id="btnClearAll"
                        class="flex items-center gap-1 bg-red-950/40 hover:bg-red-900/40 px-3 py-1.5 rounded text-xs text-red-400 border border-red-900/30 font-medium transition active-scale">
                        🗑️ ลบโค้ดทั้งหมด
                    </button>

                </div>
            </div>

            <!-- INPUT EDITOR -->
            <div
                id="inputEditorContainer"
                class="flex-1 min-h-[380px] bg-slate-950">
            </div>

            <!-- FIX BUTTON -->
            <div class="p-4 bg-slate-900 border-t border-slate-800">

                <button
                    id="btnFixCode"
                    class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold px-6 py-3 rounded-lg shadow-lg shadow-purple-900/20 transition active-scale">
                    🚀 แก้ Code Error
                </button>

            </div>
        </div>


        <!-- RIGHT -->
        <div class="flex flex-col bg-slate-950 rounded-xl border border-slate-800 overflow-hidden shadow-xl">

            <div class="bg-slate-900 px-4 py-3 flex justify-between items-center border-b border-slate-800">

                <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    โค้ดหลังแก้ไข
                </span>

                <button
                    id="btnCopyFixed"
                    class="hidden flex items-center gap-1 bg-emerald-950/50 hover:bg-emerald-900/50 px-3 py-1.5 rounded text-xs text-emerald-400 border border-emerald-900/30 font-medium transition active-scale">
                    📋 คัดลอกโค้ดที่แก้แล้ว
                </button>

            </div>


            <div
                id="outputSection"
                class="flex-1 flex flex-col p-4 justify-center items-center">

                <!-- EMPTY -->
                <div
                    id="emptyState"
                    class="text-center p-6 border-2 border-dashed border-slate-800 rounded-lg max-w-sm">

                    <p class="text-slate-500 text-sm font-medium">
                        ระบบพร้อมทำงาน
                    </p>

                    <p class="text-xs text-slate-600 mt-1">
                        วาง JavaScript ที่มี Error ทางด้านซ้าย
                        แล้วกดปุ่มแก้ไข
                    </p>

                </div>


                <!-- LOADING -->
                <div
                    id="loadingState"
                    class="hidden text-center">

                    <div
                        class="w-8 h-8 border-4 border-purple-500/20 border-t-purple-500 rounded-full animate-spin mx-auto mb-3">
                    </div>

                    <p class="text-sm text-slate-400">
                        กำลังตรวจสอบโค้ด...
                    </p>

                </div>


                <!-- RESULT -->
                <div
                    id="resultState"
                    class="hidden w-full h-full flex flex-col gap-4">

                    <!-- EXPLANATION -->
                    <div
                        class="bg-purple-950/20 border border-purple-800/40 rounded-lg p-3.5 flex gap-2.5 items-start">

                        <span class="text-purple-400 mt-0.5">
                            ⚠️
                        </span>

                        <div>

                            <h4
                                class="text-xs font-bold text-purple-300 uppercase tracking-wider">
                                รายงานการตรวจสอบ
                            </h4>

                            <p
                                id="explanationText"
                                class="text-sm text-slate-300 mt-1 leading-relaxed">
                            </p>

                        </div>
                    </div>


                    <!-- OUTPUT EDITOR -->
                    <div class="flex-1 flex flex-col">

                        <h4
                            class="text-xs font-semibold text-slate-400 mb-2">
                            โค้ดฉบับแก้ไข:
                        </h4>

                        <div
                            id="outputEditorContainer"
                            class="flex-1 min-h-[300px] border border-slate-800 rounded-lg overflow-hidden">
                        </div>

                    </div>

                </div>

            </div>
        </div>

    </div>


    <!-- MONACO LOADER -->
    <script>
        var require = {
            paths: {
                vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"
            }
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>


    <script>
        let inputEditor = null;
        let outputEditor = null;
        let oldDecorations = [];

        const defaultCode = `function checkScores(score) {
    if (score >= 50) {
        console.log("Pass");
    } els {
        console.log("Fail");
    }
}`;


        /*
         * โหลด Monaco Editor
         */
        require(["vs/editor/editor.main"], function () {

            inputEditor = monaco.editor.create(
                document.getElementById("inputEditorContainer"),
                {
                    value: defaultCode,
                    language: "javascript",
                    theme: "vs-dark",
                    fontSize: 14,
                    minimap: {
                        enabled: false
                    },
                    automaticLayout: true,
                    padding: {
                        top: 12
                    },
                    scrollBeyondLastLine: false
                }
            );


            outputEditor = monaco.editor.create(
                document.getElementById("outputEditorContainer"),
                {
                    value: "",
                    language: "javascript",
                    theme: "vs-dark",
                    fontSize: 14,
                    readOnly: true,
                    minimap: {
                        enabled: false
                    },
                    automaticLayout: true,
                    padding: {
                        top: 12
                    },
                    scrollBeyondLastLine: false
                }
            );


            setupAppLogic();

        });


        /*
         * ระบบหลัก
         */
        function setupAppLogic() {

            const btnFixCode =
                document.getElementById("btnFixCode");

            const btnClearAll =
                document.getElementById("btnClearAll");

            const btnCopyInput =
                document.getElementById("btnCopyInput");

            const btnCopyFixed =
                document.getElementById("btnCopyFixed");

            const emptyState =
                document.getElementById("emptyState");

            const loadingState =
                document.getElementById("loadingState");

            const resultState =
                document.getElementById("resultState");

            const explanationText =
                document.getElementById("explanationText");


            /*
             * FIX CODE
             */
            btnFixCode.addEventListener("click", function () {

                const currentCode =
                    inputEditor.getValue();


                if (!currentCode.trim()) {

                    alert(
                        "กรุณาวางโค้ดฝั่งซ้ายก่อนครับ"
                    );

                    return;
                }


                oldDecorations =
                    inputEditor.deltaDecorations(
                        oldDecorations,
                        []
                    );


                emptyState.classList.add("hidden");

                resultState.classList.add("hidden");

                btnCopyFixed.classList.add("hidden");

                loadingState.classList.remove("hidden");


                setTimeout(function () {

                    const result =
                        fixJavaScript(currentCode);


                    outputEditor.setValue(
                        result.fixedCode
                    );

                    explanationText.innerText =
                        result.explanation;


                    /*
                     * แสดงเส้นใต้ Error
                     */
                    if (result.error) {

                        oldDecorations =
                            inputEditor.deltaDecorations(
                                [],
                                [
                                    {
                                        range:
                                            new monaco.Range(
                                                result.error.line,
                                                result.error.start,
                                                result.error.line,
                                                result.error.end
                                            ),

                                        options: {

                                            className:
                                                "purple-squiggly-error",

                                            hoverMessage: {
                                                value:
                                                    "❌ " +
                                                    result.explanation
                                            },

                                            isWholeLine:
                                                false
                                        }
                                    }
                                ]
                            );
                    }


                    loadingState.classList.add("hidden");

                    resultState.classList.remove("hidden");

                    btnCopyFixed.classList.remove("hidden");


                    setTimeout(function () {

                        outputEditor.layout();

                    }, 50);


                }, 500);

            });


            /*
             * CLEAR
             */
            btnClearAll.addEventListener(
                "click",
                function () {

                    inputEditor.setValue("");

                    outputEditor.setValue("");

                    explanationText.innerText = "";

                    oldDecorations =
                        inputEditor.deltaDecorations(
                            oldDecorations,
                            []
                        );

                    emptyState.classList.remove(
                        "hidden"
                    );

                    resultState.classList.add(
                        "hidden"
                    );

                    btnCopyFixed.classList.add(
                        "hidden"
                    );

                    loadingState.classList.add(
                        "hidden"
                    );
                }
            );


            /*
             * COPY INPUT
             */
            btnCopyInput.addEventListener(
                "click",
                async function () {

                    const code =
                        inputEditor.getValue();

                    await copyText(code);

                    const oldText =
                        btnCopyInput.innerText;

                    btnCopyInput.innerText =
                        "✅ คัดลอกแล้ว!";

                    setTimeout(function () {

                        btnCopyInput.innerText =
                            oldText;

                    }, 2000);
                }
            );


            /*
             * COPY OUTPUT
             */
            btnCopyFixed.addEventListener(
                "click",
                async function () {

                    const code =
                        outputEditor.getValue();

                    await copyText(code);

                    const oldText =
                        btnCopyFixed.innerText;

                    btnCopyFixed.innerText =
                        "✅ คัดลอกสำเร็จ!";

                    setTimeout(function () {

                        btnCopyFixed.innerText =
                            "📋 คัดลอกโค้ดที่แก้แล้ว";

                    }, 2000);
                }
            );

        }


        /*
         * ฟังก์ชันคัดลอก
         */
        async function copyText(text) {

            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        text
                    );

                    return;
                }


                const textarea =
                    document.createElement("textarea");

                textarea.value = text;

                textarea.style.position =
                    "fixed";

                textarea.style.opacity = "0";

                document.body.appendChild(
                    textarea
                );

                textarea.focus();

                textarea.select();

                document.execCommand("copy");

                textarea.remove();

            } catch (error) {

                alert(
                    "ไม่สามารถคัดลอกอัตโนมัติได้ กรุณาคัดลอกด้วยตัวเอง"
                );

            }

        }


        /*
         * ========================================
         * SMART JAVASCRIPT FIXER
         * ========================================
         */
        function fixJavaScript(code) {

            let fixedCode = code;

            let explanation =
                "ไม่พบ Error ตามกฎที่ระบบตรวจสอบ ระบบจึงคงโค้ดเดิมไว้";

            let error = null;


            /*
             * ERROR 1
             * els -> else
             */
            const elsMatch =
                code.match(/\bels(?=\s*\{|\s*$)/m);

            if (elsMatch) {

                fixedCode =
                    code.replace(
                        /\bels(?=\s*\{|\s*$)/gm,
                        "else"
                    );


                const lines =
                    code.split("\n");

                const lineIndex =
                    lines.findIndex(function (line) {

                        return /\bels(?=\s*\{|\s*$)/.test(
                            line
                        );

                    });


                if (lineIndex !== -1) {

                    const column =
                        lines[lineIndex].indexOf(
                            "els"
                        );


                    error = {
                        line: lineIndex + 1,
                        start: column + 1,
                        end: column + 4
                    };

                }


                explanation =
                    "พบคำสั่ง 'els' ซึ่งเป็นคำสะกดผิดของ JavaScript keyword 'else' ระบบแก้ไขเป็น 'else' แล้ว";

                return {
                    fixedCode,
                    explanation,
                    error
                };
            }


            /*
             * ERROR 2
             * functon -> function
             */
            const functionMatch =
                code.match(/\bfuncton\b/);

            if (functionMatch) {

                fixedCode =
                    code.replace(
                        /\bfuncton\b/g,
                        "function"
                    );


                const lines =
                    code.split("\n");

                const lineIndex =
                    lines.findIndex(function (line) {

                        return line.includes(
                            "functon"
                        );

                    });


                if (lineIndex !== -1) {

                    const column =
                        lines[lineIndex].indexOf(
                            "functon"
                        );


                    error = {
                        line: lineIndex + 1,
                        start: column + 1,
                        end: column + 8
                    };

                }


                explanation =
                    "พบคำสั่ง 'functon' ซึ่งสะกดผิดจาก keyword 'function' ระบบแก้ไขให้แล้ว";

                return {
                    fixedCode,
                    explanation,
                    error
                };
            }


            /*
             * ERROR 3
             * console.lg -> console.log
             */
            const consoleMatch =
                code.match(/\bconsole\.lg\b/);

            if (consoleMatch) {

                fixedCode =
                    code.replace(
                        /\bconsole\.lg\b/g,
                        "console.log"
                    );


                const lines =
                    code.split("\n");

                const lineIndex =
                    lines.findIndex(function (line) {

                        return line.includes(
                            "console.lg"
                        );

                    });


                if (lineIndex !== -1) {

                    const column =
                        lines[lineIndex].indexOf(
                            "console.lg"
                        );


                    error = {
                        line: lineIndex + 1,
                        start: column + 1,
                        end: column + 11
                    };

                }


                explanation =
                    "พบการเรียกใช้ console.lg ซึ่งไม่ใช่คำสั่งมาตรฐาน ระบบแก้เป็น console.log แล้ว";

                return {
                    fixedCode,
                    explanation,
                    error
                };
            }


            /*
             * ERROR 4
             * const -> cont
             */
            const constMatch =
                code.match(/\bcont\s+[A-Za-z_$]/);

            if (constMatch) {

                fixedCode =
                    code.replace(
                        /\bcont(?=\s+[A-Za-z_$])/g,
                        "const"
                    );


                const lines =
                    code.split("\n");

                const lineIndex =
                    lines.findIndex(function (line) {

                        return /\bcont\s+[A-Za-z_$]/.test(
                            line
                        );

                    });


                if (lineIndex !== -1) {

                    const column =
                        lines[lineIndex].indexOf(
                            "cont"
                        );


                    error = {
                        line: lineIndex + 1,
                        start: column + 1,
                        end: column + 5
                    };

                }


                explanation =
                    "พบคำสั่ง 'cont' ซึ่งน่าจะเป็นการพิมพ์ผิดจาก 'const' ระบบแก้ไขให้แล้ว";

                return {
                    fixedCode,
                    explanation,
                    error
                };
            }


            /*
             * ERROR 5
             * let -> le
             */
            const letMatch =
                code.match(/\ble\s+[A-Za-z_$]/);

            if (letMatch) {

                fixedCode =
                    code.replace(
                        /\ble(?=\s+[A-Za-z_$])/g,
                        "let"
                    );


                const lines =
                    code.split("\n");

                const lineIndex =
                    lines.findIndex(function (line) {

                        return /\ble\s+[A-Za-z_$]/.test(
                            line
                        );

                    });


                if (lineIndex !== -1) {

                    const column =
                        lines[lineIndex].indexOf(
                            "le"
                        );


                    error = {
                        line: lineIndex + 1,
                        start: column + 1,
                        end: column + 3
                    };

                }


                explanation =
                    "พบคำสั่ง 'le' ซึ่งน่าจะเป็นการพิมพ์ผิดจาก 'let' ระบบแก้ไขให้แล้ว";

                return {
                    fixedCode,
                    explanation,
                    error
                };
            }


            /*
             * ERROR 6
             * === -> =
             * ไม่แก้ เพราะอาจเป็นโค้ดที่ตั้งใจใช้
             */


            /*
             * ไม่มี Error ตามกฎ
             */
            return {
                fixedCode,
                explanation,
                error
            };

        }
    </script>

</body>
</html>
