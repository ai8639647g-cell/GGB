<script>
"use strict";

/* =========================================================
   CODE SHIELD V5
   Local Number Encoder / Decoder
   ========================================================= */

let activeDecodedContent = "";


/* =========================================================
   1. ENCRYPT
   ========================================================= */

function encryptProcess() {

    const rawCode =
        document.getElementById("rawCodeInput").value;

    const level =
        document.getElementById("shieldLevel").value;

    const outputArea =
        document.getElementById("outputNumberArea");


    if (!rawCode.trim()) {

        alert("กรุณากรอกโค้ดต้นทางก่อนครับ");

        return;
    }


    const resultNumbers = [];

    /*
     * Header
     */
    resultNumbers.push("L" + level);


    for (let i = 0; i < rawCode.length; i++) {

        const codeChar =
            rawCode.charCodeAt(i);


        switch (level) {

            /*
             * LEVEL 1
             */
            case "1":

                resultNumbers.push(
                    String(codeChar)
                );

                break;


            /*
             * LEVEL 2
             */
            case "2":

                resultNumbers.push(
                    String(codeChar + 15)
                );

                break;


            /*
             * LEVEL 3
             */
            case "3":

                resultNumbers.push(
                    String((codeChar * 2) + 5)
                );

                break;


            /*
             * LEVEL 4
             */
            case "4":

                resultNumbers.push(
                    String((codeChar + 33) * 3)
                );

                break;


            /*
             * LEVEL 5
             *
             * รูปแบบ:
             * realValue.salt
             *
             * salt เป็นข้อมูลรบกวน
             * แต่ไม่ถูกใช้ในการถอดรหัส
             */
            case "5": {

                const fakeSalt =
                    Math.floor(Math.random() * 80) + 10;

                const encodedValue =
                    (codeChar * 7) + 103;

                resultNumbers.push(
                    encodedValue + "." + fakeSalt
                );

                break;
            }


            default:

                throw new Error(
                    "Unknown encryption level"
                );
        }
    }


    outputArea.value =
        resultNumbers.join("-");


    activeDecodedContent = "";


    updateStatusLabel(
        "แปลงรหัสสำเร็จ • Level " + level,
        "text-emerald-400"
    );
}


/* =========================================================
   2. DECRYPT
   ========================================================= */

function decryptProcess() {

    let inputNumbers =
        document.getElementById("outputNumberArea").value.trim();

    const iframe =
        document.getElementById("liveRenderFrame");


    if (!inputNumbers) {

        alert(
            "กรุณาวางชุดตัวเลขในช่องด้านบนขวาก่อนครับ"
        );

        return;
    }


    /*
     * ลบ whitespace
     */
    inputNumbers =
        inputNumbers.replace(/\s+/g, "");


    const segments =
        inputNumbers.split("-");


    let detectedLevel = "1";

    let startIndex = 0;


    /*
     * ตรวจ Header
     */
    if (
        segments.length > 0 &&
        /^L[1-5]$/.test(segments[0])
    ) {

        detectedLevel =
            segments[0].substring(1);

        startIndex = 1;

    } else {

        /*
         * ถ้าไม่มี Header
         * ถือว่าเป็น Level 1
         */
        detectedLevel = "1";

        startIndex = 0;
    }


    try {

        let finalHtml = "";


        for (
            let i = startIndex;
            i < segments.length;
            i++
        ) {

            const segment =
                segments[i].trim();


            if (!segment) {
                continue;
            }


            let decodedCharCode;


            /*
             * LEVEL 1
             */
            if (detectedLevel === "1") {

                decodedCharCode =
                    Number(segment);
            }


            /*
             * LEVEL 2
             */
            else if (detectedLevel === "2") {

                decodedCharCode =
                    Number(segment) - 15;
            }


            /*
             * LEVEL 3
             */
            else if (detectedLevel === "3") {

                decodedCharCode =
                    (Number(segment) - 5) / 2;
            }


            /*
             * LEVEL 4
             */
            else if (detectedLevel === "4") {

                decodedCharCode =
                    (Number(segment) / 3) - 33;
            }


            /*
             * LEVEL 5
             */
            else if (detectedLevel === "5") {

                /*
                 * แยกส่วนจริงออกจาก Salt
                 *
                 * เช่น
                 * 768.45
                 *
                 * ใช้เฉพาะ 768
                 */
                const parts =
                    segment.split(".");


                if (parts.length !== 2) {

                    throw new Error(
                        "รูปแบบ Level 5 ไม่ถูกต้อง"
                    );
                }


                const realPart =
                    Number(parts[0]);


                decodedCharCode =
                    (realPart - 103) / 7;
            }


            /*
             * ตรวจสอบผลลัพธ์
             */
            if (
                !Number.isFinite(decodedCharCode) ||
                !Number.isInteger(decodedCharCode) ||
                decodedCharCode < 0 ||
                decodedCharCode > 0x10FFFF
            ) {

                throw new Error(
                    "Invalid character code"
                );
            }


            finalHtml +=
                String.fromCodePoint(decodedCharCode);
        }


        if (!finalHtml) {

            throw new Error(
                "Decoding Failure"
            );
        }


        /*
         * เก็บ HTML ที่ถอดแล้ว
         */
        activeDecodedContent =
            finalHtml;


        /*
         * แสดงใน iframe
         */
        const iframeDoc =
            iframe.contentDocument ||
            iframe.contentWindow.document;


        iframeDoc.open();

        iframeDoc.write(finalHtml);

        iframeDoc.close();


        updateStatusLabel(
            "ทดสอบรันสำเร็จ • Level " +
            detectedLevel,
            "text-cyan-400 font-bold"
        );

    }

    catch (error) {

        console.error(
            "Decode Error:",
            error
        );


        activeDecodedContent = "";


        updateStatusLabel(
            "รหัสเสียหายหรือรูปแบบไม่ถูกต้อง",
            "text-rose-400 font-bold"
        );


        alert(
            "⚠️ ไม่สามารถถอดรหัสชุดตัวเลขนี้ได้\n\n" +
            "ตรวจสอบว่า:\n" +
            "• ชุดตัวเลขไม่ถูกตัด\n" +
            "• ใช้เครื่องหมาย - ถูกต้อง\n" +
            "• Level ตรงกับตอนแปลง\n" +
            "• Level 5 ต้องมีรูปแบบ ตัวเลข.Salt"
        );
    }
}


/* =========================================================
   3. FULLSCREEN PREVIEW
   ========================================================= */

function launchFullscreenPreview() {

    /*
     * ถ้ายังไม่มี decoded content
     * ให้ลอง decode จากช่องตัวเลขก่อน
     */
    if (!activeDecodedContent) {

        const checkInput =
            document.getElementById(
                "outputNumberArea"
            ).value.trim();


        if (!checkInput) {

            alert(
                "ไม่พบข้อมูลสำหรับเปิด Preview"
            );

            return;
        }


        decryptProcess();


        /*
         * ถ้าถอดไม่ได้
         */
        if (!activeDecodedContent) {
            return;
        }
    }


    /*
     * เปิดแท็บใหม่
     */
    const newTabView =
        window.open(
            "",
            "_blank"
        );


    if (!newTabView) {

        alert(
            "เบราว์เซอร์บล็อก Popup กรุณาอนุญาต Popup สำหรับเว็บไซต์นี้"
        );

        return;
    }


    newTabView.document.open();

    newTabView.document.write(
        activeDecodedContent
    );

    newTabView.document.close();
}


/* =========================================================
   4. STATUS
   ========================================================= */

function updateStatusLabel(text, cssClass) {

    const label =
        document.getElementById(
            "diagnoseStatus"
        );


    label.innerHTML =
        "สถานะเลข: " +
        '<span class="' +
        cssClass +
        '">' +
        escapeHtml(text) +
        "</span>";
}


/*
 * ป้องกันข้อความสถานะกลายเป็น HTML
 */
function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   5. LOAD TEXT FILE
   ========================================================= */

function loadTextFile(input) {

    const file =
        input.files &&
        input.files[0];


    if (!file) {
        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(event) {

        const content =
            event.target.result;


        document.getElementById(
            "outputNumberArea"
        ).value = content;


        updateStatusLabel(
            "โหลดไฟล์ข้อความสำเร็จ",
            "text-amber-400"
        );


        /*
         * ทดลอง Decode ทันที
         */
        decryptProcess();
    };


    reader.onerror = function() {

        alert(
            "ไม่สามารถอ่านไฟล์ได้"
        );
    };


    reader.readAsText(
        file,
        "UTF-8"
    );


    /*
     * Reset input เพื่อให้เลือกไฟล์เดิมซ้ำได้
     */
    input.value = "";
}


/* =========================================================
   6. SAVE TEXT FILE
   ========================================================= */

function saveAsTextFile() {

    const content =
        document.getElementById(
            "outputNumberArea"
        ).value.trim();


    if (!content) {

        alert(
            "ไม่มีชุดตัวเลขให้บันทึก"
        );

        return;
    }


    const level =
        document.getElementById(
            "shieldLevel"
        ).value;


    const blob =
        new Blob(
            [content],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;


    a.download =
        "code-numbers-level-" +
        level +
        ".txt";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    /*
     * ล้าง Object URL
     */
    setTimeout(
        () => URL.revokeObjectURL(url),
        1000
    );


    const btn =
        document.getElementById(
            "btnSaveText"
        );


    btn.innerText =
        "ดาวน์โหลดแล้ว!";


    setTimeout(
        () => {
            btn.innerText =
                "ดาวน์โหลด";
        },
        2000
    );
}


/* =========================================================
   7. COPY
   ========================================================= */

async function copyToClipboard() {

    const area =
        document.getElementById(
            "outputNumberArea"
        );


    if (!area.value.trim()) {
        return;
    }


    try {

        /*
         * Clipboard API
         */
        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                area.value
            );

        } else {

            /*
             * Fallback สำหรับบาง Browser
             */
            area.focus();

            area.select();

            document.execCommand(
                "copy"
            );

            area.setSelectionRange(0, 0);
        }


        const btn =
            document.getElementById(
                "btnCopyText"
            );


        btn.innerText =
            "คัดลอกแล้ว!";


        setTimeout(
            () => {
                btn.innerText =
                    "คัดลอก";
            },
            2000
        );

    }

    catch (error) {

        console.error(
            "Clipboard Error:",
            error
        );

        alert(
            "ไม่สามารถคัดลอกอัตโนมัติได้ กรุณากดค้างที่ข้อความแล้วเลือกคัดลอก"
        );
    }
}
