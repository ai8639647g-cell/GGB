<!DOCTYPE html><html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core System</title><style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #f8fafc;
        padding: 10px;
    }

    .chat-container {
        width: 100%;
        max-width: 800px;
        height: 85vh;
        background: #111827;
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #1f2937;
    }

    .chat-messages {
        flex: 1;
        padding: 25px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: #0b0f19;
    }

    .message {
        max-width: 85%;
        padding: 15px 20px;
        border-radius: 12px;
        font-size: 1rem;
        line-height: 1.6;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
    }

    .user-message {
        background: #2563eb;
        color: #ffffff;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
    }

    .ai-message {
        background: #1f2937;
        color: #f8fafc;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
        border: 1px solid #374151;
    }

    pre {
        background: #030712;
        padding: 15px;
        border-radius: 8px;
        overflow-x: auto;
        margin-top: 10px;
        border: 1px solid #1f2937;
        color: #34d399;
        font-family: 'Courier New', monospace;
        white-space: pre;
    }

    .chat-input-area {
        padding: 20px;
        background: #111827;
        display: flex;
        gap: 12px;
        border-top: 1px solid #374151;
    }

    .chat-input {
        flex: 1;
        padding: 16px 24px;
        border: 1px solid #374151;
        border-radius: 8px;
        outline: none;
        font-size: 1rem;
        background: #0b0f19;
        color: #f8fafc;
        transition: 0.2s;
    }

    .chat-input:focus {
        border-color: #2563eb;
    }

    .chat-input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .send-btn {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0 30px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        transition: 0.2s;
    }

    .send-btn:hover {
        background: #1d4ed8;
    }

    .send-btn:disabled {
        background: #374151;
        color: #9ca3af;
        cursor: not-allowed;
    }

    @media (max-width: 600px) {
        .chat-container {
            height: 95vh;
            border-radius: 10px;
        }

        .chat-messages {
            padding: 15px;
        }

        .chat-input-area {
            padding: 12px;
        }

        .chat-input {
            padding: 14px;
        }

        .send-btn {
            padding: 0 20px;
        }

        .message {
            max-width: 92%;
        }
    }
</style>

</head><body><div class="chat-container">

    <!-- แสดงการสนทนา -->
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">
            สวัสดีครับ ระบบพร้อมทำงานแล้ว คุณสามารถพิมพ์ข้อความ ค้นหาข้อมูลแอป หรือสั่งให้เขียนโค้ดได้เลยครับ
        </div>
    </div>

    <!-- ช่องรับข้อความ -->
    <div class="chat-input-area">
        <input
            type="text"
            id="userInput"
            class="chat-input"
            placeholder="พิมพ์ข้อความ ค้นหา หรือสั่งงานที่นี่..."
            autocomplete="off"
        >

        <button id="sendBtn" class="send-btn">
            ส่ง
        </button>
    </div>

</div>

<script>
    "use strict";

    const chatMessages = document.getElementById("chatMessages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    /*
     * ฟังก์ชันแสดงข้อความในหน้าแชต
     */
    function renderResponse(text, sender, codeBlock = "") {
        const messageDiv = document.createElement("div");

        messageDiv.classList.add(
            "message",
            sender === "user" ? "user-message" : "ai-message"
        );

        messageDiv.innerText = text;

        if (codeBlock) {
            const pre = document.createElement("pre");
            pre.innerText = codeBlock;
            messageDiv.appendChild(pre);
        }

        chatMessages.appendChild(messageDiv);

        chatMessages.scrollTop = chatMessages.scrollHeight;

        return messageDiv;
    }

    /*
     * ระบบประมวลผลคำสั่ง
     */
    function globalSearchEngine(query) {
        const cleanQuery = query.trim().toLowerCase();

        let output = {
            reply:
                `ระบบได้รับข้อความ "${query}" แล้วครับ ` +
                `ตอนนี้ระบบสามารถตอบคำถามพื้นฐาน วิเคราะห์คำสั่ง ` +
                `และสร้างตัวอย่างโค้ดจากคำสั่งที่รองรับได้ครับ`,
            code: ""
        };

        /*
         * 1. คำสั่งเขียนโค้ด / สร้างโปรแกรม
         */
        if (
            cleanQuery.includes("เขียนโค้ด") ||
            cleanQuery.includes("สร้างโค้ด") ||
            cleanQuery.includes("code") ||
            cleanQuery.includes("โปรแกรม")
        ) {

            /*
             * HTML / Web
             */
            if (
                cleanQuery.includes("html") ||
                cleanQuery.includes("เว็บ")
            ) {

                output.reply =
                    "ระบบตรวจพบคำสั่งสร้างเว็บไซต์ " +
                    "จึงสร้างโครงสร้าง HTML5 พื้นฐานให้คุณครับ:";

                output.code = `<!DOCTYPE html>

<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าเว็บของฉัน</title>
</head><body>
    <h1>ยินดีต้อนรับสู่เว็บไซต์</h1>
    <p>นี่คือเว็บไซต์ที่สร้างด้วย HTML</p>
</body>
</html>`;            /*
             * Python
             */
            } else if (
                cleanQuery.includes("python") ||
                cleanQuery.includes("ไพธอน")
            ) {

                output.reply =
                    "ระบบตรวจพบคำสั่ง Python และสร้างตัวอย่างโค้ดให้ครับ:";

                output.code = `def ai_response(message):
print(f"ระบบกำลังอ่านค่า: {message}")
return "ประมวลผลสำเร็จ"

message = "${query.replace(/"/g, '\"')}"

print(ai_response(message))`;

            /*
             * JavaScript
             */
            } else {

                output.reply =
                    "ระบบตรวจพบคำสั่งให้เขียนโปรแกรม " +
                    "จึงสร้างตัวอย่าง JavaScript ให้ครับ:";

                output.code = `function processCommand(input) {
return "ระบบวิเคราะห์ข้อมูล: " + input;

}

console.log(
processCommand(${JSON.stringify(query)})
);`;
}

            return output;
        }

        /*
         * 2. ค้นหาแอป / ข้อมูลแอป
         */
        if (
            cleanQuery.includes("ค้นหาแอป") ||
            cleanQuery.includes("ข้อมูลแอป") ||
            cleanQuery.includes("facebook") ||
            cleanQuery.includes("youtube") ||
            cleanQuery.includes("แอป")
        ) {

            /*
             * Facebook
             */
            if (
                cleanQuery.includes("facebook") ||
                cleanQuery.includes("เฟสบุ๊ค") ||
                cleanQuery.includes("เฟซบุ๊ก")
            ) {

                output.reply =
                    "Facebook คือแพลตฟอร์มโซเชียลมีเดีย " +
                    "สำหรับการเชื่อมต่อและสื่อสารระหว่างผู้ใช้งาน " +
                    "รวมถึงการแชร์ข้อความ รูปภาพ วิดีโอ และการสร้าง Page หรือ Group ครับ";

            /*
             * YouTube
             */
            } else if (
                cleanQuery.includes("youtube") ||
                cleanQuery.includes("ยูทูป") ||
                cleanQuery.includes("ยูทูบ")
            ) {

                output.reply =
                    "YouTube คือแพลตฟอร์มวิดีโอออนไลน์ " +
                    "ที่ผู้ใช้สามารถรับชม อัปโหลด แสดงความคิดเห็น " +
                    "และติดตามช่องต่าง ๆ ได้ครับ";

            /*
             * แอปทั่วไป
             */
            } else {

                output.reply =
                    `ระบบได้รับคำค้นหาแอป "${query}" แล้วครับ ` +
                    `เวอร์ชันนี้เป็นระบบจำลองการค้นหาในหน้าเว็บ ` +
                    `จึงยังไม่ได้เชื่อมต่อ App Store หรือ Google Play โดยตรง`;
            }

            return output;
        }

        /*
         * 3. คำทักทาย
         */
        if (
            cleanQuery.includes("สวัสดี") ||
            cleanQuery.includes("หวัดดี") ||
            cleanQuery.includes("สบายดีไหม") ||
            cleanQuery.includes("ทำอะไรอยู่")
        ) {

            output.reply =
                "สวัสดีครับ! 👋 " +
                "ระบบ AI Core พร้อมรับคำสั่งแล้วครับ " +
                "คุณสามารถลองพิมพ์ว่า \"เขียนโค้ด HTML\" " +
                "หรือ \"สร้างโปรแกรม Python\" ได้เลยครับ";

            return output;
        }

        /*
         * 4. คำสั่งช่วยเหลือ
         */
        if (
            cleanQuery === "ช่วยเหลือ" ||
            cleanQuery === "help"
        ) {

            output.reply =
                "คำสั่งตัวอย่างที่สามารถทดลองได้:\n\n" +
                "• สวัสดี\n" +
                "• เขียนโค้ด HTML\n" +
                "• สร้างเว็บ\n" +
                "• เขียน Python\n" +
                "• เขียน JavaScript\n" +
                "• ข้อมูลแอป Facebook\n" +
                "• ข้อมูล YouTube";

            return output;
        }

        return output;
    }

    /*
     * ตัวควบคุมระบบแชต
     */
    function handleChatFlow() {

        const userText = userInput.value.trim();

        if (!userText) {
            return;
        }

        /*
         * แสดงข้อความผู้ใช้
         */
        renderResponse(userText, "user");

        userInput.value = "";

        /*
         * ปิดช่องรับข้อความระหว่างประมวลผล
         */
        sendBtn.disabled = true;
        userInput.disabled = true;

        /*
         * แสดงสถานะกำลังคิด
         */
        const thinkingBox = renderResponse(
            "กำลังคิด...",
            "ai"
        );

        /*
         * จำลองเวลาประมวลผล
         */
        setTimeout(() => {

            const finalResult =
                globalSearchEngine(userText);

            /*
             * ล้างข้อความเดิม
             */
            thinkingBox.innerText =
                finalResult.reply;

            /*
             * ถ้ามีโค้ดให้สร้าง Code Block
             */
            if (finalResult.code) {

                const pre =
                    document.createElement("pre");

                pre.innerText =
                    finalResult.code;

                thinkingBox.appendChild(pre);
            }

            /*
             * เปิดช่องรับข้อความอีกครั้ง
             */
            sendBtn.disabled = false;
            userInput.disabled = false;

            userInput.focus();

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }, 500);
    }

    /*
     * ปุ่มส่ง
     */
    sendBtn.addEventListener(
        "click",
        handleChatFlow
    );

    /*
     * กด Enter เพื่อส่ง
     */
    userInput.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {
                event.preventDefault();
                handleChatFlow();
            }

        }
    );

    /*
     * โฟกัสช่องข้อความเมื่อเปิดหน้าเว็บ
     */
    userInput.focus();

</script>

</body>
</html>
