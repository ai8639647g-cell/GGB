<script>

"use strict";

/*
    =========================================================
    CODE SHIELD CORE ENGINE V4.0
    =========================================================
*/

let latestDecodedHtml = "";


/*
    =========================================================
    1. ENCRYPT
    โค้ด -> ตัวเลข
    =========================================================
*/

function encryptCodeToNumbers() {

    const rawCode =
        document.getElementById("rawCodeInput").value;

    const securityLevel =
        document.getElementById("securityLevel").value;

    const outputArea =
        document.getElementById("outputArea");


    if (!rawCode.trim()) {

        alert(
            "โปรดวางโค้ดในช่องด้านซ้ายก่อนครับ"
        );

        return;
    }


    let numberSequence = [];


    /*
        Standard
        multiplier = 3
        offset = 7

        Ultra
        multiplier = 5
        offset = 12
    */

    const offset =
        securityLevel === "ultra"
            ? 12
            : 7;

    const multiplier =
        securityLevel === "ultra"
            ? 5
            : 3;


    /*
        Header
    */

    numberSequence.push(
        securityLevel === "ultra"
            ? "U"
            : "S"
    );


    /*
        Convert characters
    */

    for (let i = 0; i < rawCode.length; i++) {

        const charCode =
            rawCode.charCodeAt(i);

        const encoded =
            charCode * multiplier + offset;

        numberSequence.push(encoded);

    }


    /*
        Show output
    */

    outputArea.value =
        numberSequence.join("-");


    /*
        Status
    */

    showStatus(
        "เข้ารหัสสำเร็จ!",
        "success"
    );

}


/*
    =========================================================
    2. DECRYPT
    ตัวเลข -> HTML
    =========================================================
*/

function decryptNumbersToPreview() {

    let outputText =
        document.getElementById("outputArea").value.trim();

    const iframe =
        document.getElementById("appPreviewFrame");


    if (!outputText) {

        alert(
            "ไม่พบชุดตัวเลข กรุณาใส่ข้อมูลก่อนครับ"
        );

        return;
    }


    try {

        /*
            Auto clean
        */

        outputText =
            outputText.replace(/\s+/g, "");


        const numberArray =
            outputText.split("-");


        if (numberArray.length < 2) {

            throw new Error(
                "Invalid code pattern"
            );

        }


        /*
            Detect security level
        */

        let multiplier = 3;
        let offset = 7;
        let startIndex = 0;


        if (numberArray[0] === "S") {

            multiplier = 3;
            offset = 7;
            startIndex = 1;

        }

        else if (numberArray[0] === "U") {

            multiplier = 5;
            offset = 12;
            startIndex = 1;

        }

        else {

            /*
                ถ้าไม่มี header
                ให้ถือเป็น Standard
            */

            multiplier = 3;
            offset = 7;
            startIndex = 0;

        }


        let decodedCode = "";


        /*
            Decode
        */

        for (
            let i = startIndex;
            i < numberArray.length;
            i++
        ) {

            const numStr =
                numberArray[i];


            if (
                numStr !== "" &&
                /^-?\d+$/.test(numStr)
            ) {

                const encodedNumber =
                    parseInt(numStr, 10);


                const originalChar =
                    (encodedNumber - offset) /
                    multiplier;


                /*
                    Validate character
                */

                if (
                    !Number.isInteger(originalChar) ||
                    originalChar < 0 ||
                    originalChar > 0xFFFF
                ) {

                    throw new Error(
                        "Invalid character"
                    );

                }


                decodedCode +=
                    String.fromCharCode(
                        originalChar
                    );

            }

        }


        if (!decodedCode) {

            throw new Error(
                "Empty decoded code"
            );

        }


        /*
            Save latest HTML
        */

        latestDecodedHtml =
            decodedCode;


        /*
            Render iframe
        */

        const iframeDoc =
            iframe.contentDocument ||
            iframe.contentWindow.document;


        iframeDoc.open();

        iframeDoc.write(decodedCode);

        iframeDoc.close();


        showStatus(
            "ถอดรหัสและแสดงผลสำเร็จ!",
            "success"
        );

    }

    catch (error) {

        console.error(error);


        alert(
            "🚨 ไม่สามารถถอดรหัสได้\n\n" +
            "กรุณาตรวจสอบชุดตัวเลขว่าไม่ขาดหรือมีอักขระผิดรูปแบบ"
        );

    }

}


/*
    =========================================================
    3. IMPORT TXT
    =========================================================
*/

function importTxtFile(input) {

    const file =
        input.files[0];


    if (!file) {
        return;
    }


    if (
        !file.name.toLowerCase().endsWith(".txt")
    ) {

        alert(
            "กรุณาเลือกไฟล์ .txt เท่านั้น"
        );

        input.value = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function (event) {

            document.getElementById(
                "outputArea"
            ).value =
                event.target.result;


            alert(
                "📥 โหลดชุดข้อมูลจากไฟล์สำเร็จ!\n\n" +
                "กดปุ่มถอดรหัสเพื่อแสดงผล"
            );

        };


    reader.onerror =
        function () {

            alert(
                "ไม่สามารถอ่านไฟล์ได้"
            );

        };


    reader.readAsText(
        file,
        "UTF-8"
    );


    /*
        Reset file input
        เพื่อให้สามารถเลือกไฟล์เดิมซ้ำได้
    */

    input.value = "";

}


/*
    =========================================================
    4. DOWNLOAD TXT
    =========================================================
*/

function downloadAsTxtFile() {

    const outputText =
        document.getElementById(
            "outputArea"
        ).value.trim();


    if (!outputText) {

        alert(
            "ยังไม่มีข้อมูลตัวเลขสำหรับบันทึก"
        );

        return;
    }


    const blob =
        new Blob(
            [outputText],
            {
                type: "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    const dateStr =
        new Date()
            .toISOString()
            .slice(0, 10);


    link.download =
        `shielded-code-${dateStr}.txt`;


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    URL.revokeObjectURL(url);


    const buttonText =
        document.getElementById(
            "downloadBtnTxt"
        );


    buttonText.innerText =
        "บันทึกแล้ว!";


    setTimeout(
        function () {

            buttonText.innerText =
                "เซฟ";

        },
        2000
    );

}


/*
    =========================================================
    5. FULLSCREEN PREVIEW
    =========================================================
*/

function openFullscreenPreview() {

    if (!latestDecodedHtml) {

        /*
            ถ้ายังไม่ได้ Decode
            ลอง Decode จาก Output ก่อน
        */

        decryptNumbersToPreview();


        if (!latestDecodedHtml) {
            return;
        }

    }


    /*
        เปิดหน้าต่างใหม่
    */

    const fullScreenWindow =
        window.open(
            "",
            "_blank"
        );


    if (!fullScreenWindow) {

        alert(
            "Browser บล็อกหน้าต่างใหม่\n" +
            "กรุณาอนุญาต Pop-up สำหรับเว็บไซต์นี้"
        );

        return;
    }


    fullScreenWindow.document.open();

    fullScreenWindow.document.write(
        latestDecodedHtml
    );

    fullScreenWindow.document.close();

}


/*
    =========================================================
    6. CLEAR INPUT
    =========================================================
*/

function clearInput() {

    document.getElementById(
        "rawCodeInput"
    ).value = "";

}


/*
    =========================================================
    7. CLEAR EVERYTHING
    =========================================================
*/

function clearEverything() {

    document.getElementById(
        "rawCodeInput"
    ).value = "";


    document.getElementById(
        "outputArea"
    ).value = "";


    latestDecodedHtml = "";


    const iframe =
        document.getElementById(
            "appPreviewFrame"
        );


    const iframeDoc =
        iframe.contentDocument ||
        iframe.contentWindow.document;


    iframeDoc.open();

    iframeDoc.write("");

    iframeDoc.close();


    document.getElementById(
        "securityLevel"
    ).value = "standard";

}


/*
    =========================================================
    8. COPY OUTPUT
    =========================================================
*/

async function copyOutput() {

    const textToCopy =
        document.getElementById(
            "outputArea"
        ).value;


    if (!textToCopy.trim()) {

        alert(
            "ยังไม่มีข้อมูลสำหรับคัดลอก"
        );

        return;
    }


    try {

        await navigator.clipboard.writeText(
            textToCopy
        );


        const btnTxt =
            document.getElementById(
                "copyBtnTxt"
            );


        btnTxt.innerText =
            "คัดลอกสำเร็จ!";


        setTimeout(
            function () {

                btnTxt.innerText =
                    "คัดลอก";

            },
            2000
        );

    }

    catch (error) {

        /*
            Fallback สำหรับ browser
            ที่ไม่รองรับ Clipboard API
        */

        const temp =
            document.createElement("textarea");


        temp.value =
            textToCopy;


        document.body.appendChild(temp);


        temp.select();


        try {

            document.execCommand("copy");

            alert(
                "คัดลอกข้อมูลแล้ว!"
            );

        }

        catch (e) {

            alert(
                "Browser ไม่อนุญาตให้คัดลอกอัตโนมัติ"
            );

        }


        document.body.removeChild(temp);

    }

}


/*
    =========================================================
    9. STATUS HELPER
    =========================================================
*/

function showStatus(message, type) {

    /*
        ใช้ console เป็นหลัก
        เพื่อไม่รบกวนการใช้งานด้วย alert
    */

    if (type === "success") {

        console.log(
            "✓ CODE SHIELD:",
            message
        );

    }

    else {

        console.warn(
            "CODE SHIELD:",
            message
        );

    }

}

        /*
            Ctrl + Enter

        if (
            event.ctrlKey &&

        ) {

            event.preventDefault();

            encryptCodeToNumbers();

        }


        /*
            Ctrl + Shift + Enter

        */

        if (
            event.ctrlKey &&
            event.shiftKey &&
            event.key === "Enter"
        ) {

            event.preventDefault();

            decryptNumbersToPreview();

        }

    }
);
