<!DOCTYPE html><html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>⚡ VAULT-LUAU OBFUSCATOR ULTRA v6</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Sarabun:wght@400;600;700&display=swap');

    :root {
        --bg-dark: #040408;
        --panel-bg: rgba(10, 10, 18, 0.9);
        --neon-red: #ff0055;
        --neon-cyan: #00f0ff;
        --neon-amber: #ffaa00;
        --text-color: #f0f0f5;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Sarabun', sans-serif;
        background-color: var(--bg-dark);
        background-image:
            radial-gradient(
                at 10% 20%,
                rgba(255, 0, 85, 0.15) 0px,
                transparent 40%
            ),
            radial-gradient(
                at 90% 80%,
                rgba(0, 240, 255, 0.15) 0px,
                transparent 40%
            );
        color: var(--text-color);
        margin: 0;
        padding: 30px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .vault-container {
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border: 2px solid var(--neon-red);

        box-shadow:
            0 0 50px rgba(255, 0, 85, 0.3),
            inset 0 0 20px rgba(0, 240, 255, 0.05);

        width: 100%;
        max-width: 1200px;
        padding: 40px;
        border-radius: 16px;
        position: relative;
    }

    .vault-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;

        background:
            linear-gradient(
                90deg,
                var(--neon-red),
                var(--neon-cyan)
            );

        border-radius: 16px 16px 0 0;
    }

    .vault-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        border-bottom: 1px solid rgba(255, 255, 255, 0.1);

        padding-bottom: 20px;
        margin-bottom: 35px;
    }

    .vault-title {
        font-family: 'Orbitron', 'Sarabun', sans-serif;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 3px;

        background:
            linear-gradient(
                45deg,
                var(--neon-red),
                var(--neon-cyan)
            );

        -webkit-background-clip: text;
        background-clip: text;

        -webkit-text-fill-color: transparent;

        text-shadow:
            0 0 15px rgba(255, 0, 85, 0.3);
    }

    .vault-icon {
        font-size: 32px;
        filter:
            drop-shadow(
                0 0 8px var(--neon-red)
            );
    }

    .vault-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 35px;
    }

    @media (max-width: 900px) {
        .vault-grid {
            grid-template-columns: 1fr;
        }

        .action-bar {
            grid-column: auto;
        }
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }

        .vault-container {
            padding: 20px;
        }

        .vault-title {
            font-size: 19px;
            letter-spacing: 1px;
        }

        .vault-icon {
            font-size: 25px;
        }

        textarea {
            height: 320px;
        }

        .action-bar {
            flex-direction: column;
        }

        button {
            width: 100%;
        }
    }

    .editor-section {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    label {
        font-family: 'Orbitron', 'Sarabun', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--neon-cyan);
        margin-bottom: 12px;
        text-transform: uppercase;
    }

    textarea {
        width: 100%;
        height: 400px;

        background: #020204;

        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;

        color: #fff;

        padding: 18px;

        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.6;

        resize: vertical;

        transition: all 0.3s ease;
    }

    textarea:focus {
        outline: none;

        border-color: var(--neon-red);

        box-shadow:
            0 0 20px rgba(255, 0, 85, 0.2);
    }

    .output-box {
        color: #39ff14;

        background: #010102;

        text-shadow:
            0 0 2px rgba(57, 255, 20, 0.3);
    }

    .action-bar {
        grid-column: 1 / -1;

        background:
            rgba(255, 255, 255, 0.02);

        border:
            1px solid rgba(255, 255, 255, 0.06);

        padding: 20px;
        border-radius: 10px;

        display: flex;
        justify-content: flex-end;

        gap: 15px;

        margin-top: 10px;
    }

    button {
        font-family:
            'Orbitron',
            'Sarabun',
            sans-serif;

        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1px;

        padding: 14px 28px;

        border: none;
        border-radius: 6px;

        cursor: pointer;

        transition:
            all 0.2s ease;

        text-transform: uppercase;

        color: #fff;
    }

    button:active {
        transform: scale(0.97);
    }

    .btn-obfuscate {
        background:
            linear-gradient(
                135deg,
                #ff0055,
                #bc003f
            );

        box-shadow:
            0 0 15px rgba(255, 0, 85, 0.3);
    }

    .btn-obfuscate:hover {
        box-shadow:
            0 0 25px rgba(255, 0, 85, 0.6);
    }

    .btn-copy {
        background:
            linear-gradient(
                135deg,
                #00f0ff,
                #00a8b5
            );

        box-shadow:
            0 0 15px rgba(0, 240, 255, 0.3);

        color: #000;
    }

    .btn-copy:hover {
        box-shadow:
            0 0 25px rgba(0, 240, 255, 0.6);
    }

    .btn-clear {
        background: transparent;

        border:
            1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-clear:hover {
        background:
            rgba(255, 255, 255, 0.05);

        border-color: #fff;
    }

    .footer-status {
        margin-top: 25px;

        font-size: 12px;

        padding: 10px 15px;

        background:
            rgba(0, 0, 0, 0.5);

        border-left:
            4px solid var(--neon-cyan);

        border-radius:
            0 6px 6px 0;

        color: #bbb;

        display: flex;
        align-items: center;

        gap: 10px;

        word-break: break-word;
    }

    .secure-dot {
        width: 8px;
        height: 8px;

        min-width: 8px;

        background-color:
            var(--neon-cyan);

        border-radius: 50%;

        animation:
            pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% {
            box-shadow:
                0 0 0 0
                rgba(0, 240, 255, 0.6);
        }

        70% {
            box-shadow:
                0 0 0 10px
                rgba(0, 240, 255, 0);
        }

        100% {
            box-shadow:
                0 0 0 0
                rgba(0, 240, 255, 0);
        }
    }
</style>

</head><body><div class="vault-container">

    <div class="vault-header">

        <div class="vault-title">
            🔒 VAULT CORE V6: PERMANENT OBFUSCATION
        </div>

        <div class="vault-icon">
            🔮
        </div>

    </div>

    <div class="vault-grid">

        <div class="editor-section">

            <label>
                📝 INPUT: โค้ดต้นฉบับภาษา Luau
            </label>

            <textarea
                id="srcInput"
                spellcheck="false"
                placeholder="-- วางสคริปต์ Luau ที่นี่...

print('Hello Delta Executor')"
></textarea>

        </div>

        <div class="editor-section">

            <label style="color: var(--neon-red);">
                🛰️ OUTPUT: สคริปต์เข้ารหัส
            </label>

            <textarea
                id="cryptOutput"
                class="output-box"
                readonly
                spellcheck="false"
                placeholder="[ กดปุ่มแปลงด้านล่างเพื่อสร้างผลลัพธ์ ]"
            ></textarea>

        </div>

        <div class="action-bar">

            <button
                class="btn-clear"
                type="button"
                onclick="clearWorkspace()"
            >
                🗑️ ล้างหน้าจอ
            </button>

            <button
                class="btn-copy"
                type="button"
                onclick="copyToClipboard()"
            >
                📋 คัดลอกผลลัพธ์
            </button>

            <button
                class="btn-obfuscate"
                type="button"
                onclick="obfuscateCore()"
            >
                ⚡ แปลงและปกป้องโค้ด
            </button>

        </div>

    </div>

    <div class="footer-status">

        <div
            class="secure-dot"
            id="dot"
        ></div>

        <span id="statusTxt">
            สถานะระบบ: สแตนด์บาย
        </span>

    </div>

</div>

<script>
"use strict";

/* ================================
   STATUS SYSTEM
================================ */

function setLog(text, statusType) {

    const txt =
        document.getElementById("statusTxt");

    const dot =
        document.getElementById("dot");

    txt.innerText = "ระบบ: " + text;

    if (statusType === "success") {

        dot.style.backgroundColor =
            "#00f0ff";

        txt.style.color =
            "#00f0ff";

    } else if (statusType === "copied") {

        dot.style.backgroundColor =
            "#39ff14";

        txt.style.color =
            "#39ff14";

    } else {

        dot.style.backgroundColor =
            "#ff0055";

        txt.style.color =
            "#ff0055";
    }
}


/* ================================
   OBFUSCATOR
================================ */

function obfuscateCore() {

    const input =
        document.getElementById("srcInput");

    const output =
        document.getElementById("cryptOutput");

    const source =
        input.value;

    if (!source.trim()) {

        setLog(
            "กรุณาใส่สคริปต์ต้นฉบับก่อนทำการแปลง!",
            "error"
        );

        input.focus();

        return;
    }

    try {

        const payload = [];

        /*
         * Encode source characters.
         * ใช้ charCodeAt รองรับ Unicode
         */
        for (
            let i = 0;
            i < source.length;
            i++
        ) {

            const ascii =
                source.charCodeAt(i);

            const keyShift =
                (i % 9) + 3;

            const dynamicMath =
                (ascii ^ keyShift)
                + (i * 3)
                - 12;

            payload.push(
                dynamicMath
            );
        }


        /* ============================
           FAKE / JUNK DATA
        ============================ */

        let junkData = "";

        for (
            let j = 0;
            j < 35;
            j++
        ) {

            const fakeArr = [];

            for (
                let k = 0;
                k < 12;
                k++
            ) {

                fakeArr.push(
                    Math.floor(
                        Math.random() * 800 + 200
                    )
                );
            }

            junkData +=
                "local _fake_var_" +
                j +
                " = {" +
                fakeArr.join(",") +
                "} " +
                "if #_fake_var_" +
                j +
                " == 5555 then " +
                "pcall(function() " +
                "return table.concat(_fake_var_" +
                j +
                ") " +
                "end) " +
                "end\n";
        }


        /* ============================
           BUILD OUTPUT
        ============================ */

        const dataString =
            payload.join(",");

        let finalScript =
            "--[[ " +
            "PROTECTED BY VAULT " +
            "ANTI-DECOMPILE v6 " +
            "]]\n";

        finalScript +=
            "if not game:IsLoaded() then\n" +
            "    game.Loaded:Wait()\n" +
            "end\n";

        finalScript +=
            junkData;

        finalScript +=
            "local _encData = {" +
            dataString +
            "}\n";

        finalScript +=
            "local _vmRun = \"\"\n";

        finalScript +=
            "for i = 1, #_encData do\n";

        finalScript +=
            "    local _idx = i - 1\n";

        finalScript +=
            "    local _key = (_idx % 9) + 3\n";

        finalScript +=
            "    local _extracted = " +
            "bit32.bxor(" +
            "(_encData[i] + 12 - (_idx * 3)), " +
            "_key" +
            ")\n";

        finalScript +=
            "    _vmRun = _vmRun .. " +
            "string.char(_extracted)\n";

        finalScript +=
            "end\n";

        finalScript +=
            "local _runtime, _err = " +
            "loadstring(_vmRun)\n";

        finalScript +=
            "if _runtime then\n" +
            "    task.spawn(_runtime)\n" +
            "else\n" +
            "    warn(\"[FATAL] Security layer block: \" .. tostring(_err))\n" +
            "end\n";

        finalScript +=
            "--[[ " +
            "VAULT CORE V6 " +
            "END " +
            "]]";


        output.value =
            finalScript;

        setLog(
            "แปลงโค้ดสำเร็จ!",
            "success"
        );

    } catch (error) {

        console.error(error);

        setLog(
            "เกิดข้อผิดพลาด: " +
            error.message,
            "error"
        );
    }
}


/* ================================
   COPY
================================ */

async function copyToClipboard() {

    const output =
        document.getElementById(
            "cryptOutput"
        );

    const textToCopy =
        output.value;

    if (!textToCopy.trim()) {

        setLog(
            "ไม่มีข้อมูลรหัสให้คัดลอก!",
            "error"
        );

        return;
    }


    /* Modern Clipboard API */

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        try {

            await navigator.clipboard.writeText(
                textToCopy
            );

            setLog(
                "📋 คัดลอกโค้ดสำเร็จ!",
                "copied"
            );

            return;

        } catch (error) {

            console.warn(
                "Clipboard API failed:",
                error
            );
        }
    }


    /* Fallback */

    fallbackCopy(textToCopy);
}


/* ================================
   FALLBACK COPY
================================ */

function fallbackCopy(text) {

    const textArea =
        document.createElement(
            "textarea"
        );

    textArea.value =
        text;

    textArea.setAttribute(
        "readonly",
        ""
    );

    textArea.style.position =
        "fixed";

    textArea.style.top =
        "0";

    textArea.style.left =
        "-9999px";

    textArea.style.opacity =
        "0";

    document.body.appendChild(
        textArea
    );

    textArea.focus();

    textArea.select();

    textArea.setSelectionRange(
        0,
        text.length
    );

    let successful = false;

    try {

        successful =
            document.execCommand(
                "copy"
            );

    } catch (error) {

        console.error(error);
    }

    document.body.removeChild(
        textArea
    );


    if (successful) {

        setLog(
            "📋 คัดลอกโค้ดสำเร็จ! (Fallback)",
            "copied"
        );

    } else {

        setLog(
            "คัดลอกอัตโนมัติไม่สำเร็จ กรุณากดค้างที่ช่อง Output แล้วเลือกคัดลอก",
            "error"
        );
    }
}


/* ================================
   CLEAR
================================ */

function clearWorkspace() {

    document.getElementById(
        "srcInput"
    ).value = "";

    document.getElementById(
        "cryptOutput"
    ).value = "";

    setLog(
        "ล้างเวิร์กสเปซเรียบร้อยแล้ว ระบบสแตนด์บาย",
        "success"
    );

    document.getElementById(
        "dot"
    ).style.backgroundColor =
        "#00f0ff";

    document.getElementById(
        "statusTxt"
    ).style.color =
        "#00f0ff";
}


/* ================================
   KEYBOARD SHORTCUT
================================ */

document.addEventListener(
    "keydown",
    function(event) {

        /* Ctrl + Enter / Android keyboard */

        if (
            (event.ctrlKey || event.metaKey) &&
            event.key === "Enter"
        ) {

            event.preventDefault();

            obfuscateCore();
        }
    }
);
</script></body>
</html>
