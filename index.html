<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CYBER SLAYER MOBILE - ULTRA EDITION</title>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #ff0055;
    --secondary: #00ffcc;
    --ult-color: #9900ff;
    --bg-dark: #05050a;
    --panel-bg: rgba(10,10,20,.9);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    color: #fff;
    font-family: 'Prompt', sans-serif;
}

button,
input {
    font-family: inherit;
}

/* ================= MENU ================= */

#menu-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #190b28 0%, #020105 70%);
}

.menu-box {
    width: 90%;
    max-width: 430px;
    padding: 25px;
    text-align: center;
    background: var(--panel-bg);
    border: 2px solid var(--secondary);
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,255,204,.2);
    backdrop-filter: blur(15px);
}

.menu-box h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.1rem;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 22px;
    text-shadow: 0 0 15px var(--primary);
}

.input-group {
    margin-bottom: 20px;
    text-align: left;
}

.input-group label,
.weapon-select-title {
    display: block;
    margin-bottom: 7px;
    color: var(--secondary);
    font-size: .8rem;
    font-weight: 600;
}

.input-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
    outline: none;
    background: rgba(0,0,0,.7);
    color: #fff;
    font-size: 1rem;
}

.weapon-options {
    display: flex;
    gap: 8px;
    margin-bottom: 25px;
}

.weapon-btn {
    flex: 1;
    padding: 11px 5px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
    background: rgba(255,255,255,.05);
    color: #aaa;
    font-size: .78rem;
    font-weight: 700;
}

.weapon-btn.active {
    border-color: var(--secondary);
    color: var(--secondary);
    background: rgba(0,255,204,.15);
    box-shadow: 0 0 12px rgba(0,255,204,.3);
}

.btn-start {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg,var(--primary),#cc0044);
    color: #fff;
    font-family: 'Orbitron',sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    box-shadow: 0 5px 20px rgba(255,0,85,.4);
}

/* ================= GAME ================= */

#game-container {
    position: fixed;
    inset: 0;
    display: none;
}

#canvas-holder {
    width: 100%;
    height: 100%;
    transition: transform .05s ease;
}

#canvas-holder canvas {
    display: block;
}

/* ================= HUD ================= */

.hud-panel {
    position: absolute;
    z-index: 20;
    padding: 12px 15px;
    background: rgba(0,0,0,.6);
    border-radius: 8px;
    backdrop-filter: blur(5px);
    pointer-events: none;
    font-family: 'Orbitron', sans-serif;
}

.hud-top-left {
    top: 15px;
    left: 15px;
    border-left: 4px solid var(--secondary);
}

.hud-top-right {
    top: 15px;
    right: 15px;
    text-align: right;
    border-right: 4px solid var(--primary);
}

#hud-player-name {
    font-size: 1rem;
    font-weight: 700;
}

#weapon-lbl {
    margin-top: 3px;
    color: var(--secondary);
    font-size: .65rem;
}

.hp-bar-container {
    width: 160px;
    height: 12px;
    margin-top: 7px;
    overflow: hidden;
    border-radius: 6px;
    background: rgba(255,255,255,.2);
}

#hp-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,#ff0055,#ff5500);
    transition: width .1s;
}

#score-val {
    color: var(--secondary);
    font-size: 1.5rem;
    font-weight: 900;
}

#wave-lbl {
    color: var(--primary);
    font-size: .8rem;
    font-weight: 700;
}

/* ================= JOYSTICK ================= */

#joystick-zone {
    position: absolute;
    z-index: 50;
    left: 35px;
    bottom: 35px;
    width: 130px;
    height: 130px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid rgba(0,255,204,.25);
    border-radius: 50%;
    background: rgba(255,255,255,.05);
}

#joystick-knob {
    position: absolute;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle,var(--secondary),#006652);
    box-shadow: 0 0 15px var(--secondary);
}

/* ================= ACTION BUTTONS ================= */

.action-zone {
    position: absolute;
    right: 30px;
    bottom: 30px;
    z-index: 50;
    width: 190px;
    height: 190px;
}

#attack-btn {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 100px;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 3px solid #fff;
    border-radius: 50%;
    background: radial-gradient(circle,var(--primary),#990033);
    color: #fff;
    box-shadow: 0 0 20px rgba(255,0,85,.5);
    font-family: 'Orbitron',sans-serif;
    font-weight: 900;
    font-size: 1rem;
}

#skill-btn {
    position: absolute;
    top: 0;
    left: 0;
    width: 68px;
    height: 68px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    border: 2px solid #fff;
    border-radius: 50%;
    background: radial-gradient(circle,var(--ult-color),#5500aa);
    color: #fff;
    box-shadow: 0 0 15px rgba(153,0,255,.5);
    font-family: 'Orbitron',sans-serif;
    font-weight: 900;
    font-size: .65rem;
}

.cooldown-overlay {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: rgba(0,0,0,.7);
    color: #fff;
    font-size: 1rem;
}

/* ================= GAME OVER ================= */

#game-over-screen {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(5,2,10,.95);
    text-align: center;
}

#game-over-screen h2 {
    margin-bottom: 10px;
    color: var(--primary);
    font-family: 'Orbitron',sans-serif;
    font-size: 3rem;
    text-shadow: 0 0 20px var(--primary);
}

#final-score-lbl {
    color: var(--secondary);
    font-family: 'Orbitron',sans-serif;
}

.btn-restart {
    margin-top: 25px;
    padding: 14px 40px;
    border: 2px solid var(--secondary);
    border-radius: 8px;
    background: transparent;
    color: var(--secondary);
    font-family: 'Orbitron',sans-serif;
    font-size: 1rem;
    font-weight: 700;
}

@media (max-width:600px) {
    .hud-panel {
        padding: 8px 10px;
    }

    .hud-top-left {
        top: 8px;
        left: 8px;
    }

    .hud-top-right {
        top: 8px;
        right: 8px;
    }

    .hp-bar-container {
        width: 130px;
    }

    #joystick-zone {
        left: 20px;
        bottom: 20px;
    }

    .action-zone {
        right: 20px;
        bottom: 20px;
    }

    #game-over-screen h2 {
        font-size: 2.5rem;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu-screen">
    <div class="menu-box">

        <h1>CYBER SLAYER</h1>

        <div class="input-group">
            <label>ชื่อนักรบไซเบอร์</label>
            <input
                type="text"
                id="username-input"
                value="Slayer_Mobile"
                maxlength="12"
            >
        </div>

        <div class="weapon-select-title">
            เลือกอาวุธประจำกาย
        </div>

        <div class="weapon-options">
            <button
                class="weapon-btn active"
                onclick="selectWeapon('katana',this)"
            >
                ⚡ KATANA
            </button>

            <button
                class="weapon-btn"
                onclick="selectWeapon('axe',this)"
            >
                🪓 CYBER AXE
            </button>

            <button
                class="weapon-btn"
                onclick="selectWeapon('spear',this)"
            >
                🔱 SPEAR
            </button>
        </div>

        <button class="btn-start" onclick="startGame()">
            LAUNCH MISSION
        </button>

    </div>
</div>

<!-- ================= GAME ================= -->

<div id="game-container">

    <div id="canvas-holder"></div>

    <!-- HUD -->
    <div class="hud-panel hud-top-left">

        <div id="hud-player-name">
            Player
        </div>

        <div id="weapon-lbl">
            WEAPON: KATANA
        </div>

        <div class="hp-bar-container">
            <div id="hp-bar"></div>
        </div>

    </div>

    <div class="hud-panel hud-top-right">

        <div id="wave-lbl">
            WAVE 1
        </div>

        <div id="score-val">
            0000
        </div>

    </div>

    <!-- JOYSTICK -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- ACTIONS -->
    <div class="action-zone">

        <button id="skill-btn" onclick="useUltimate()">
            <span>ULT</span>
            <span>READY</span>

            <div
                id="skill-cd"
                class="cooldown-overlay"
            >
                5
            </div>
        </button>

        <button id="attack-btn">
            SLASH
        </button>

    </div>

    <!-- GAME OVER -->
    <div id="game-over-screen">

        <h2>MISSION FAILED</h2>

        <div id="final-score-lbl">
            TOTAL SCORE: 0
        </div>

        <button
            class="btn-restart"
            onclick="restartGame()"
        >
            RESPAWN
        </button>

    </div>

</div>

<script>

/* =========================================================
   CYBER SLAYER MOBILE
   ========================================================= */

let scene;
let camera;
let renderer;

let player;
let weaponMesh;

let zombies = [];
let bloodParticles = [];
let shockwaves = [];

let playerHp = 100;
let score = 0;
let wave = 1;
let killCount = 0;

let isGameOver = false;
let isAttacking = false;

let attackCooldown = 0;
let ultCooldown = 0;

let playerName = "Player";
let currentWeapon = "katana";

let joystickZone;
let joystickKnob;

let joystickActive = false;

let joystickStartX = 0;
let joystickStartY = 0;

let moveX = 0;
let moveZ = 0;

let shakeIntensity = 0;

let gameStarted = false;
let spawnTimer = null;


/* =========================================================
   WEAPONS
   ========================================================= */

const weaponStats = {

    katana: {
        range: 2.6,
        damage: 1,
        speed: 0.45,
        color: 0x00ffcc,
        size: [0.08,1.5,0.15]
    },

    axe: {
        range: 2.2,
        damage: 2.5,
        speed: 0.25,
        color: 0xff0055,
        size: [0.2,1.3,0.4]
    },

    spear: {
        range: 3.5,
        damage: 1.2,
        speed: 0.35,
        color: 0xffff00,
        size: [0.06,2.2,0.08]
    }

};


/* =========================================================
   WEAPON SELECT
   ========================================================= */

function selectWeapon(type, btn) {

    currentWeapon = type;

    document
        .querySelectorAll(".weapon-btn")
        .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");
}


/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

    const input =
        document
        .getElementById("username-input")
        .value
        .trim();

    if (input) {
        playerName = input;
    }

    document.getElementById("hud-player-name").innerText =
        playerName;

    document.getElementById("weapon-lbl").innerText =
        "WEAPON: " + currentWeapon.toUpperCase();

    document.getElementById("menu-screen").style.display =
        "none";

    document.getElementById("game-container").style.display =
        "block";

    init3D();
    setupMobileControls();

    gameStarted = true;

    animate();

}


/* =========================================================
   INIT THREE.JS
   ========================================================= */

function init3D() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x020206);

    scene.fog =
        new THREE.FogExp2(
            0x020206,
            0.06
        );


    camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

    camera.position.set(
        0,
        11,
        8.5
    );

    camera.lookAt(
        0,
        0,
        0
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.shadowMap.enabled = true;


    document
        .getElementById("canvas-holder")
        .appendChild(renderer.domElement);


    /* LIGHT */

    scene.add(
        new THREE.AmbientLight(
            0x303040,
            1
        )
    );

    const dirLight =
        new THREE.DirectionalLight(
            0xff0055,
            1
        );

    dirLight.position.set(
        15,
        25,
        10
    );

    dirLight.castShadow = true;

    scene.add(dirLight);


    /* GROUND */

    const grid =
        new THREE.GridHelper(
            120,
            45,
            0xff0055,
            0x111122
        );

    scene.add(grid);


    /* PLAYER */

    player =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                2,
                1
            ),
            new THREE.MeshStandardMaterial({
                color: 0x0066ff,
                emissive: 0x001133
            })
        );

    player.position.set(
        0,
        1,
        0
    );

    player.castShadow = true;

    scene.add(player);


    createWeapon();


    /* RESIZE */

    window.addEventListener(
        "resize",
        onWindowResize
    );


    /* ZOMBIE SPAWN */

    if (spawnTimer) {
        clearInterval(spawnTimer);
    }

    spawnTimer =
        setInterval(
            spawnZombieLoop,
            1200
        );

}


/* =========================================================
   CREATE WEAPON
   ========================================================= */

function createWeapon() {

    if (weaponMesh) {

        player.remove(weaponMesh);

        weaponMesh.geometry.dispose();
        weaponMesh.material.dispose();

    }

    const stats =
        weaponStats[currentWeapon];

    weaponMesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                stats.size[0],
                stats.size[1],
                stats.size[2]
            ),
            new THREE.MeshStandardMaterial({
                color: stats.color,
                emissive: stats.color,
                emissiveIntensity: .4
            })
        );

    weaponMesh.position.set(
        0.6,
        0.2,
        -0.4
    );

    weaponMesh.rotation.x =
        Math.PI / 2;

    weaponMesh.castShadow = true;

    player.add(weaponMesh);

}


/* =========================================================
   RESIZE
   ========================================================= */

function onWindowResize() {

    if (!camera || !renderer) return;

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

function setupMobileControls() {

    joystickZone =
        document.getElementById(
            "joystick-zone"
        );

    joystickKnob =
        document.getElementById(
            "joystick-knob"
        );


    joystickZone.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            joystickActive = true;

            const rect =
                joystickZone.getBoundingClientRect();

            joystickStartX =
                rect.left +
                rect.width / 2;

            joystickStartY =
                rect.top +
                rect.height / 2;

        },
        { passive:false }
    );


    window.addEventListener(
        "touchmove",
        function(e) {

            if (!joystickActive) return;

            e.preventDefault();

            let touch =
                e.touches[0];

            let dx =
                touch.clientX -
                joystickStartX;

            let dy =
                touch.clientY -
                joystickStartY;

            let dist =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const maxDist = 45;

            if (dist > maxDist) {

                dx =
                    (dx / dist) *
                    maxDist;

                dy =
                    (dy / dist) *
                    maxDist;

            }

            joystickKnob.style.transform =
                `translate(${dx}px,${dy}px)`;

            moveX =
                dx / maxDist;

            moveZ =
                dy / maxDist;

        },
        { passive:false }
    );


    window.addEventListener(
        "touchend",
        function() {

            joystickActive = false;

            joystickKnob.style.transform =
                "translate(0px,0px)";

            moveX = 0;
            moveZ = 0;

        }
    );


    const attackBtn =
        document.getElementById(
            "attack-btn"
        );


    attackBtn.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            performAttack();

        },
        { passive:false }
    );

}


/* =========================================================
   ATTACK
   ========================================================= */

function performAttack() {

    if (
        !gameStarted ||
        isGameOver ||
        isAttacking ||
        attackCooldown > 0
    ) {
        return;
    }

    const stats =
        weaponStats[currentWeapon];

    isAttacking = true;

    attackCooldown =
        Math.max(
            5,
            Math.floor(
                20 / stats.speed
            )
        );

    weaponMesh.material.color.setHex(
        0xffffff
    );

}


/* =========================================================
   ULTIMATE
   ========================================================= */

function useUltimate() {

    if (
        ultCooldown > 0 ||
        isGameOver ||
        !player
    ) {
        return;
    }

    ultCooldown = 300;

    triggerScreenShake(.4);


    const waveGeo =
        new THREE.RingGeometry(
            .1,
            .5,
            32
        );

    const waveMat =
        new THREE.MeshBasicMaterial({
            color: 0x9900ff,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: .8
        });

    const waveMesh =
        new THREE.Mesh(
            waveGeo,
            waveMat
        );

    waveMesh.rotation.x =
        Math.PI / 2;

    waveMesh.position.copy(
        player.position
    );

    waveMesh.position.y =
        .1;

    scene.add(waveMesh);

    shockwaves.push(
        waveMesh
    );


    for (
        let i = zombies.length - 1;
        i >= 0;
        i--
    ) {

        const z =
            zombies[i];

        if (
            player.position.distanceTo(
                z.position
            ) <= 7
        ) {

            z.userData.hp -= 4;

            createParticles(
                z.position,
                0x9900ff,
                12
            );

            checkZombieDeath(
                z,
                i
            );

        }

    }

}


/* =========================================================
   SPAWN ZOMBIE
   ========================================================= */

function spawnZombieLoop() {

    if (
        isGameOver ||
        !player ||
        zombies.length >
        10 + wave * 2
    ) {
        return;
    }


    const zombie =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                1.9,
                .9
            ),
            new THREE.MeshStandardMaterial({
                color: 0x11aa33,
                emissive: 0x112200
            })
        );


    const angle =
        Math.random() *
        Math.PI *
        2;

    const dist =
        15 +
        Math.random() *
        7;


    zombie.position.set(
        player.position.x +
        Math.cos(angle) * dist,

        .95,

        player.position.z +
        Math.sin(angle) * dist
    );


    zombie.userData = {

        hp:
            1 +
            Math.floor(
                wave * .6
            ),

        speed:
            .038 +
            wave * .005 +
            Math.random() * .02

    };


    zombie.castShadow = true;

    scene.add(zombie);

    zombies.push(zombie);

}


/* =========================================================
   SCREEN SHAKE
   ========================================================= */

function triggerScreenShake(intensity) {

    shakeIntensity =
        Math.max(
            shakeIntensity,
            intensity
        );

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function animate() {

    if (isGameOver) return;

    requestAnimationFrame(
        animate
    );


    /* MOVEMENT */

    if (
        moveX !== 0 ||
        moveZ !== 0
    ) {

        const pSpeed =
            .13;

        player.position.x +=
            moveX * pSpeed;

        player.position.z +=
            moveZ * pSpeed;

        player.rotation.y =
            Math.atan2(
                -moveX,
                -moveZ
            );

    }


    /* CAMERA */

    camera.position.x =
        player.position.x;

    camera.position.z =
        player.position.z +
        8.5;

    camera.lookAt(
        player.position.x,
        0,
        player.position.z
    );


    /* SCREEN SHAKE */

    if (shakeIntensity > 0) {

        const sx =
            (Math.random()-.5) *
            shakeIntensity;

        const sy =
            (Math.random()-.5) *
            shakeIntensity;

        document
            .getElementById(
                "canvas-holder"
            )
            .style.transform =
            `translate(${sx*50}px,${sy*50}px)`;

        shakeIntensity *= .88;

        if (
            shakeIntensity <
            .01
        ) {

            shakeIntensity = 0;

            document
                .getElementById(
                    "canvas-holder"
                )
                .style.transform =
                "translate(0px,0px)";

        }

    }


    /* ATTACK COOLDOWN */

    if (attackCooldown > 0) {
        attackCooldown--;
    }


    /* ATTACK ANIMATION */

    if (isAttacking) {

        const stats =
            weaponStats[currentWeapon];

        weaponMesh.rotation.z +=
            stats.speed * 1.3;

        if (
            weaponMesh.rotation.z >=
            Math.PI
        ) {

            checkSwordHit();

            weaponMesh.rotation.z =
                0;

            isAttacking = false;

            weaponMesh.material.color.setHex(
                stats.color
            );

        }

    }


    /* ULT COOLDOWN */

    if (ultCooldown > 0) {

        ultCooldown--;

        const cd =
            document.getElementById(
                "skill-cd"
            );

        cd.style.display =
            "flex";

        cd.innerText =
            Math.ceil(
                ultCooldown / 60
            );

    } else {

        document
            .getElementById(
                "skill-cd"
            )
            .style.display =
            "none";

    }


    /* SHOCKWAVES */

    for (
        let i = shockwaves.length - 1;
        i >= 0;
        i--
    ) {

        const sw =
            shockwaves[i];

        sw.scale.x += .4;
        sw.scale.y += .4;

        sw.material.opacity -= .04;

        if (
            sw.material.opacity <= 0
        ) {

            scene.remove(sw);

            sw.geometry.dispose();
            sw.material.dispose();

            shockwaves.splice(
                i,
                1
            );

        }

    }


    /* ZOMBIES */

    for (
        let i = zombies.length - 1;
        i >= 0;
        i--
    ) {

        const z =
            zombies[i];

        z.lookAt(
            player.position.x,
            .95,
            player.position.z
        );

        const d =
            z.position.distanceTo(
                player.position
            );


        if (d > 1.1) {

            z.translateZ(
                z.userData.speed
            );

        } else {

            playerHp -= .45;

            updateHp();


            if (
                Math.random() >
                .85
            ) {

                triggerScreenShake(
                    .12
                );

            }


            if (
                playerHp <= 0
            ) {

                endGame();

                break;

            }

        }

    }


    /* PARTICLES */

    for (
        let i = bloodParticles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            bloodParticles[i];

        p.position.x +=
            p.userData.vx;

        p.position.y +=
            p.userData.vy;

        p.position.z +=
            p.userData.vz;

        p.userData.vy -=
            .008;

        p.userData.life--;

        if (
            p.userData.life <= 0
        ) {

            scene.remove(p);

            p.geometry.dispose();
            p.material.dispose();

            bloodParticles.splice(
                i,
                1
            );

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   HP
   ========================================================= */

function updateHp() {

    document
        .getElementById(
            "hp-bar"
        )
        .style.width =
        Math.max(
            0,
            playerHp
        ) + "%";

}


/* =========================================================
   PARTICLES
   ========================================================= */

function createParticles(
    pos,
    colorHex,
    count
) {

    for (
        let k = 0;
        k < count;
        k++
    ) {

        const p =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .07,
                    4,
                    4
                ),
                new THREE.MeshBasicMaterial({
                    color: colorHex
                })
            );

        p.position.copy(
            pos
        );

        p.userData = {

            vx:
                (Math.random()-.5) *
                .16,

            vy:
                Math.random() *
                .16,

            vz:
                (Math.random()-.5) *
                .16,

            life:
                25

        };

        scene.add(p);

        bloodParticles.push(p);

    }

}


/* =========================================================
   WEAPON HIT
   ========================================================= */

function checkSwordHit() {

    const stats =
        weaponStats[currentWeapon];

    let hitAny = false;


    for (
        let i = zombies.length - 1;
        i >= 0;
        i--
    ) {

        const z =
            zombies[i];


        if (
            player.position.distanceTo(
                z.position
            ) <= stats.range
        ) {

            z.userData.hp -=
                stats.damage;

            createParticles(
                z.position,
                0xff0055,
                6
            );

            hitAny = true;

            checkZombieDeath(
                z,
                i
            );

        }

    }


    if (hitAny) {

        triggerScreenShake(
            .18
        );

    }

}


/* =========================================================
   ZOMBIE DEATH
   ========================================================= */

function checkZombieDeath(
    zombieObj,
    index
) {

    if (
        zombieObj.userData.hp <= 0
    ) {

        createParticles(
            zombieObj.position,
            0xff0055,
            15
        );

        scene.remove(
            zombieObj
        );

        zombies.splice(
            index,
            1
        );

        score += 100;

        killCount++;


        document
            .getElementById(
                "score-val"
            )
            .innerText =
            String(score)
            .padStart(4,"0");


        if (
            killCount >=
            wave * 5
        ) {

            wave++;

            killCount = 0;

            document
                .getElementById(
                    "wave-lbl"
                )
                .innerText =
                "WAVE " + wave;

            createParticles(
                player.position,
                0x00ffcc,
                25
            );

        }

    }

}


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame() {

    if (isGameOver) return;

    isGameOver = true;

    document
        .getElementById(
            "final-score-lbl"
        )
        .innerText =
        "TOTAL SCORE: " +
        score.toLocaleString();

    document
        .getElementById(
            "game-over-screen"
        )
        .style.display =
        "flex";

}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    zombies.forEach(
        z => scene.remove(z)
    );

    zombies = [];


    bloodParticles.forEach(
        p => scene.remove(p)
    );

    bloodParticles = [];


    shockwaves.forEach(
        sw => scene.remove(sw)
    );

    shockwaves = [];


    playerHp = 100;
    score = 0;
    wave = 1;
    killCount = 0;

    isGameOver = false;
    isAttacking = false;

    attackCooldown = 0;
    ultCooldown = 0;

    moveX = 0;
    moveZ = 0;


    player.position.set(
        0,
        1,
        0
    );


    player.rotation.set(
        0,
        0,
        0
    );


    if (weaponMesh) {

        weaponMesh.rotation.z =
            0;

        weaponMesh.material.color.setHex(
            weaponStats[currentWeapon].color
        );

    }


    document
        .getElementById(
            "hp-bar"
        )
        .style.width =
        "100%";

    document
        .getElementById(
            "score-val"
        )
        .innerText =
        "0000";

    document
        .getElementById(
            "wave-lbl"
        )
        .innerText =
        "WAVE 1";

    document
        .getElementById(
            "game-over-screen"
        )
        .style.display =
        "none";


    animate();

}

</script>
