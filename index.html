<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Chat App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ส่วนหัว */
        .chat-header {
            background: #1a73e8;
            color: white;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .api-input-container {
            display: flex;
            gap: 5px;
        }

        .api-input {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            width: 150px;
        }

        /* หน้าต่างแสดงข้อความ */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8f9fa;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            background: #1a73e8;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: #e8eaed;
            color: #202124;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* ส่วนฟอร์มส่งข้อความ */
        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            outline: none;
            font-size: 1rem;
            transition: border 0.2s;
        }

        .chat-input:focus {
            border-color: #1a73e8;
        }

        .send-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #1557b0;
        }

        .send-btn:disabled {
            background: #9aa0a6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header มีช่องให้ใส่ API Key -->
        <div class="chat-header">
            <span>AI Assistant</span>
            <div class="api-input-container">
                <input type="password" id="apiKey" class="api-input" placeholder="ใส่ Gemini API Key ที่นี่">
            </div>
        </div>

        <!-- Chat Display -->
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">สวัสดีครับ! ผมคือ AI Assistant มีอะไรให้ผมช่วยเหลือไหมครับ? (กรุณาใส่ API Key ด้านบนก่อนเริ่มคุยนะครับ)</div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="พิมพ์ข้อความของคุณที่นี่..." autocomplete="off">
            <button id="sendBtn" class="send-btn">ส่ง</button>
        </div>
    </div>

    <!-- เชื่อมต่อโมเดล AI ผ่านหน้าเว็บโดยตรง -->
    <script type="module">
        import { GoogleGenAI } from "https://esm.run";

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');

        // ฟังก์ชันเพิ่มข้อความลงในหน้าจอ GUI
        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
            messageDiv.innerText = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight; // เลื่อนหน้าจอลงล่างสุดอัตโนมัติ
        }

        // ฟังก์ชันส่งข้อความไปหา AI
        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;

            if (!apiKey) {
                alert('กรุณาใส่ Gemini API Key ก่อนใช้งานครับ สามารถสมัครเอาคีย์ฟรีได้ที่ Google AI Studio');
                return;
            }

            // แสดงข้อความของผู้ใช้บนจอ
            appendMessage(text, 'user');
            userInput.value = '';
            
            // เปิดสถานะกำลังโหลด
            sendBtn.disabled = true;
            userInput.disabled = true;
            
            // สร้างกล่องข้อความรอของ AI
            const loadingDiv = document.createElement('div');
            loadingDiv.classList.add('message', 'ai-message');
            loadingDiv.innerText = 'กำลังคิด...';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // เรียกใช้งานโมเดล Gemini 2.5 Flash ซึ่งเร็วและฉลาดมาก
                const ai = new GoogleGenAI({ apiKey: apiKey });
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                });

                // ลบคำว่ากำลังคิดออก แล้วใส่คำตอบจริงเข้าไป
                loadingDiv.innerText = response.text;
            } catch (error) {
                console.error(error);
                loadingDiv.innerText = 'เกิดข้อผิดพลาด: ไม่สามารถเชื่อมต่อกับ AI ได้ กรุณาตรวจสอบ API Key ของคุณ';
            } finally {
                // เปิดให้ส่งข้อความต่อได้
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        // ดักจับการกดปุ่ม ส่ง หรือ กด Enter
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
